  if(!el) return;

  const projets = projetsList();
  if(!selectedProject || !projets.includes(selectedProject)) selectedProject = projets[0] || null;

  mount(el, `
    <div class="row-head">
      <h2>Projets</h2>
      <div class="head-right">
        <button type="button" class="btn" data-action="projet-new">+ Nouveau projet</button>
      </div>
    </div>

    ${projets.length ? `
    <div class="sub-tabs" role="tablist">
      ${projets.map(p => `
        <button type="button" class="sub-tab ${selectedProject === p ? 'active' : ''}"
                role="tab" aria-selected="${selectedProject === p}"
                data-action="projet-select" data-projet="${esc(p)}">
          ${esc(p)}
          <span class="pill">${STATE.taches.filter(t => t.projet === p && t.statut !== 'Fait').length}</span>
        </button>
      `).join('')}
    </div>` : ''}

    <div id="projets-content"></div>
  `);

  const content = byId('projets-content');
  if(!selectedProject){
    mount(content, `<div class="empty">Aucun projet. Créez-en un avec « + Nouveau projet ».</div>`);
    return;
  }

  const salles = STATE.salles.filter(s => (s.projets || []).includes(selectedProject));
  const acts = STATE.activites.filter(a => a.nom && a.nom.toLowerCase().includes(selectedProject.toLowerCase()));
  const taches = STATE.taches.filter(t => t.projet === selectedProject);
  const faites = taches.filter(t => t.statut === 'Fait').length;
  const pct = taches.length ? Math.round(faites / taches.length * 100) : 0;

  mount(content, `
    <div class="projet-head">
      <div class="projet-actions">
        <button type="button" class="btn small secondary" data-action="projet-rename" data-projet="${esc(selectedProject)}">Renommer</button>
        <button type="button" class="btn small danger" data-action="projet-delete" data-projet="${esc(selectedProject)}">Supprimer le projet</button>
      </div>
      <div class="progress-wrap" title="${faites} tâche(s) terminée(s) sur ${taches.length}">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-label">${pct}% · ${faites}/${taches.length} tâche(s)</span>
      </div>
    </div>

    <div class="stats-grid compact">
      <div class="stat"><div class="num">${taches.length - faites}</div><div class="label">Tâches en cours</div></div>
      <div class="stat"><div class="num">${salles.length}</div><div class="label">Lieux associés</div></div>
      <div class="stat"><div class="num">${acts.length}</div><div class="label">Activités liées</div></div>
    </div>

    <div id="projet-taches-content"></div>
  `);

  const panelId = 'projet-' + slugify(selectedProject);
  renderTachesScope(selectedProject, byId('projet-taches-content'), panelId);
}

registerAction('projet-select', el => {
  selectedProject = el.dataset.projet;
  renderProjets();
});

registerAction('projet-new', () => {
  const label = prompt("Nom du nouveau projet :");
  if(!label || !label.trim()) return;
  const nom = label.trim();
  if(projetsList().includes(nom)){ showToast("Ce projet existe déjà"); return; }
  STATE.projets.push(nom);
  selectedProject = nom;
  scheduleSave();
  showToast(`Projet « ${nom} » créé`);
  renderProjets();
});

registerAction('projet-rename', el => {
  const ancien = el.dataset.projet;
  const label = prompt("Nouveau nom du projet :", ancien);
  if(!label || !label.trim()) return;
  const nouveau = label.trim();
  if(nouveau === ancien) return;
  if(projetsList().includes(nouveau)){ showToast("Ce nom est déjà utilisé"); return; }

  STATE.projets = STATE.projets.map(p => p === ancien ? nouveau : p);
  STATE.taches.forEach(t => { if(t.projet === ancien) t.projet = nouveau; });
  STATE.salles.forEach(s => {
    s.projets = (s.projets || []).map(p => p === ancien ? nouveau : p);
  });
  if(tacheUI.projet === ancien) tacheUI.projet = nouveau;
  selectedProject = nouveau;

  scheduleSave();
  showToast("Projet renommé");
  renderProjets();
});

registerAction('projet-delete', el => {
  const nom = el.dataset.projet;
  const nbTaches = STATE.taches.filter(t => t.projet === nom).length;
  const msg = nbTaches
    ? `Supprimer le projet « ${nom} » ?\n${nbTaches} tâche(s) seront conservées mais détachées du projet.`
    : `Supprimer le projet « ${nom} » ?`;
  if(!confirmAction(msg)) return;

  STATE.projets = STATE.projets.filter(p => p !== nom);
  STATE.taches.forEach(t => { if(t.projet === nom) t.projet = ''; });
  STATE.salles.forEach(s => { s.projets = (s.projets || []).filter(p => p !== nom); });
  if(selectedProject === nom) selectedProject = null;
  if(tacheUI.projet === nom) tacheUI.projet = 'Tous';

  scheduleSave();
  showToast("Projet supprimé");
  renderProjets();
});

/* ==========================================================
   LIEUX
   ========================================================== */
const CAT_LABELS = { reunion: 'Réunion', metropole: 'Métropole', scolaire: 'Scolaire' };

const lieuUI = {
  categorie: 'reunion',   // 'reunion' | 'metropole' | 'scolaire' | 'proj:<nom>'
  statut: 'Toutes',
  recherche: '',
  formOuvert: null        // null | 'new' | id de la salle
};

function renderLieux(){
  const el = byId('lieux');
  if(!el) return;

  const isProjetTab = String(lieuUI.categorie).startsWith('proj:');
  const cats = ['reunion','metropole','scolaire'];

  mount(el, `
    <div class="row-head">
      <h2>Lieux</h2>
      <div class="head-right">
        <span class="count-tag">${STATE.salles.length} lieu(x) au total</span>
        <button type="button" class="btn" data-action="lieu-new">+ Nouveau lieu</button>
      </div>
    </div>

    <div class="sub-tabs" role="tablist">
      ${cats.map(cat => `
        <button type="button" class="sub-tab ${lieuUI.categorie === cat ? 'active' : ''}"
                role="tab" aria-selected="${lieuUI.categorie === cat}"
                data-action="lieu-cat" data-cat="${cat}">
          ${CAT_LABELS[cat]}
          <span class="pill">${STATE.salles.filter(s => s.categorie === cat).length}</span>
        </button>`).join('')}
      ${projetsList().length ? `<span class="sub-tabs-sep" aria-hidden="true"></span>` : ''}
      ${projetsList().map(p => `
        <button type="button" class="sub-tab ${lieuUI.categorie === 'proj:'+p ? 'active' : ''}"
                role="tab" aria-selected="${lieuUI.categorie === 'proj:'+p}"
                data-action="lieu-cat" data-cat="proj:${esc(p)}">
          🎭 ${esc(p)}
          <span class="pill">${STATE.salles.filter(s => (s.projets||[]).includes(p)).length}</span>
        </button>`).join('')}
    </div>

    <div id="lieux-content"></div>
  `);

  const content = byId('lieux-content');
  if(isProjetTab){
    renderSallesByProjet(lieuUI.categorie.slice(5), content);
  } else {
    renderSallesContent(lieuUI.categorie, content);
  }
}

function renderSallesContent(catKey, container){
  if(!container) return;

  const recherche = lieuUI.recherche.toLowerCase().trim();
  const salles = STATE.salles.filter(s => s.categorie === catKey);

  const filtered = salles.filter(s => {
    if(lieuUI.statut === '__none__' && s.statut) return false;
    if(lieuUI.statut !== 'Toutes' && lieuUI.statut !== '__none__' && s.statut !== lieuUI.statut) return false;
    if(recherche){
      const foin = [s.nom, s.ville, s.responsable, s.prochaineAction,
        ...(s.contactFields||[]).map(f => f.label + ' ' + f.value)].filter(Boolean).join(' ').toLowerCase();
      if(!foin.includes(recherche)) return false;
    }
    return true;
  });

  filtered.sort((a,b)=> (a.dateRelance || '9999-99-99').localeCompare(b.dateRelance || '9999-99-99') || a.nom.localeCompare(b.nom));

  const statutOpts = [
    ['Toutes','Tous les statuts'], ['__none__','Sans statut'],
    ['A contacter','A contacter'], ['En cours','En cours'],
    ['Obtenu','Obtenu'], ['Refusé','Refusé']
  ].map(([v,l]) => `<option value="${v}" ${lieuUI.statut===v?'selected':''}>${l}</option>`).join('');

  mount(container, `
    <div class="filters">
      <input type="search" class="search-input" placeholder="Rechercher un lieu, une ville, un contact…"
             value="${esc(lieuUI.recherche)}" aria-label="Rechercher un lieu"
             data-action="lieu-search" data-on="input">
      <select aria-label="Filtrer par statut" data-action="lieu-filter-statut" data-on="change">${statutOpts}</select>
      <span class="count-tag">${filtered.length} / ${salles.length}</span>
      ${(lieuUI.statut!=='Toutes' || lieuUI.recherche)
        ? `<button type="button" class="btn small secondary" data-action="lieu-filter-reset">Réinitialiser</button>` : ''}
    </div>

    <div id="salle-form-slot"></div>

    <div class="list">
      ${filtered.length
        ? filtered.map(s => salleItemHtml(s, null)).join('')
        : `<div class="empty">${salles.length === 0
            ? "Aucun lieu dans cette catégorie. Ajoutez-en un avec « + Nouveau lieu »."
            : "Aucun lieu ne correspond à ces filtres."}</div>`}
    </div>
  `);

  if(lieuUI.formOuvert) reopenSalleForm(catKey);
}

function renderSallesByProjet(projetName, container){
  if(!container) return;
  const salles = STATE.salles.filter(s => (s.projets || []).includes(projetName));
  salles.sort((a,b)=> (a.dateRelance || '9999-99-99').localeCompare(b.dateRelance || '9999-99-99'));

  mount(container, `
    <div class="count-tag spaced">${salles.length} lieu(x) associé(s) au projet « ${esc(projetName)} »</div>
    <div id="salle-form-slot"></div>
    <div class="list">
      ${salles.length
        ? salles.map(s => salleItemHtml(s, CAT_LABELS[s.categorie] || s.categorie)).join('')
        : `<div class="empty">Aucun lieu associé. Ouvrez un lieu dans Réunion / Métropole / Scolaire et cochez ce projet.</div>`}
    </div>
  `);

  if(lieuUI.formOuvert) reopenSalleForm(null);
}

function salleItemHtml(s, categorieLabel){
  const contacts = (s.contactFields || [])
    .map(f => `<div class="contact-line"><span class="c-label">${esc(f.label)}</span> ${esc(f.value)}</div>`).join('');
  const relanceProche = s.dateRelance && s.dateRelance <= toLocalDateStr(new Date());
  return `
    <div class="item ${statusClass('salle', s.statut)}">
      <div class="main">
        <div class="title">${esc(s.nom)}${s.ville ? ` <span class="ville">— ${esc(s.ville)}</span>` : ''}</div>
        <div class="meta">
          ${categorieLabel ? `<span>${esc(categorieLabel)}</span>` : ''}
          ${s.responsable ? `<span>Suivi : ${esc(s.responsable)}</span>` : ''}
          ${(s.projets||[]).length ? `<span>🎭 ${(s.projets||[]).map(esc).join(', ')}</span>` : ''}
          <span class="status-label">${esc(s.statut || 'Sans statut')}</span>
        </div>
        ${contacts ? `<div class="desc contacts">${contacts}</div>` : ''}
        ${s.prochaineAction
          ? `<div class="desc ${relanceProche ? 'warn' : ''}">Prochaine action : ${esc(s.prochaineAction)}${
              s.dateRelance ? ` (relance le ${formatDate(s.dateRelance)}${relanceProche ? ' ⚠' : ''})` : ''}</div>`
          : ''}
      </div>
      <div class="actions">
        <button type="button" class="btn small secondary" data-action="lieu-edit" data-id="${esc(s.id)}">Modifier</button>
        <button type="button" class="btn small danger" data-action="lieu-delete" data-id="${esc(s.id)}">Suppr.</button>
      </div>
    </div>
  `;
}

/* ---------- Formulaire de lieu ---------- */
function reopenSalleForm(catKey){
  const existing = lieuUI.formOuvert === 'new' ? null : STATE.salles.find(s => s.id === lieuUI.formOuvert);
  if(lieuUI.formOuvert !== 'new' && !existing){ lieuUI.formOuvert = null; return; }
  openSalleForm(existing, catKey, true);
}

function openSalleForm(existing, catKey, dejaOuvert){
  const slot = byId('salle-form-slot');
  if(!slot) return;

  if(!dejaOuvert) lieuUI.formOuvert = existing ? existing.id : 'new';

  const s = existing || {
    nom:'', ville:'', statut:'', prochaineAction:'', dateRelance:'',
    responsable:'', contactFields:[], projets:[],
    categorie: catKey && !String(catKey).startsWith('proj:') ? catKey : 'reunion'
  };

  const fieldsHtml = (s.contactFields || []).map(f => contactRowHtml(f.label, f.value)).join('');

  const statutOptions = ['', 'A contacter', 'En cours', 'Obtenu', 'Refusé'].map(st =>
    `<option value="${st}" ${(s.statut || '') === st ? 'selected' : ''}>${st || 'Sans statut'}</option>`).join('');

  const catOptions = Object.entries(CAT_LABELS).map(([k,l]) =>
    `<option value="${k}" ${(s.categorie || 'reunion') === k ? 'selected' : ''}>${l}</option>`).join('');

  mount(slot, `
    <div class="form-card">
      <h3>${existing ? 'Modifier le lieu' : 'Nouveau lieu'}</h3>
      <div class="form-grid">
        <label>Nom <span class="req">*</span>
          <input type="text" id="f-nom-lieu" value="${esc(s.nom)}" placeholder="Nom du lieu">
        </label>
        <label>Ville
          <input type="text" id="f-ville-lieu" value="${esc(s.ville)}">
        </label>
        <label>Catégorie
          <select id="f-cat-lieu">${catOptions}</select>
        </label>
        <label>Statut
          <select id="f-statut-lieu">${statutOptions}</select>
        </label>
        <label>Suivi par
          <select id="f-responsable-lieu">${membreOptions(s.responsable)}</select>
        </label>
        <label>Date de relance
          <input type="date" id="f-date-relance-lieu" value="${esc(s.dateRelance)}">
        </label>
        <label class="full">Prochaine action
          <input type="text" id="f-prochaine-action-lieu" value="${esc(s.prochaineAction)}" placeholder="Ex : Envoyer le dossier artistique">
        </label>

        <div class="full">
          <span class="field-legend">Contacts</span>
          <div class="contact-fields-wrap" id="contact-fields-wrap">${fieldsHtml}</div>
          <button type="button" class="add-contact-field" data-action="lieu-add-contact">+ Ajouter un contact</button>
        </div>

        <div class="full">
          <span class="field-legend">Projets concernés</span>
          <div class="checkbox-row">
            ${projetsList().length
              ? projetsList().map(p => `
                <label class="cb">
                  <input type="checkbox" class="f-projet-cb" value="${esc(p)}" ${(s.projets||[]).includes(p) ? 'checked' : ''}>
                  ${esc(p)}
                </label>`).join('')
              : '<span class="hint">Aucun projet défini pour l\'instant.</span>'}
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-action="lieu-save" data-id="${esc(existing ? existing.id : '')}">Enregistrer</button>
        <button type="button" class="btn secondary" data-action="lieu-cancel">Annuler</button>
      </div>
    </div>
  `);

  const first = slot.querySelector('#f-nom-lieu');
  if(first && !dejaOuvert) first.focus();
}

function contactRowHtml(label, value){
  return `
    <div class="contact-row">
      <input type="text" class="c-label-input" placeholder="Fonction / nom" value="${esc(label || '')}">
      <input type="text" class="c-value-input" placeholder="Email, téléphone…" value="${esc(value || '')}">
      <button type="button" class="remove-field" title="Retirer ce contact" data-action="lieu-remove-contact">✕</button>
    </div>
  `;
}

/* ---------- Actions lieux ---------- */
registerAction('lieu-cat', el => {
  lieuUI.categorie = el.dataset.cat;
  lieuUI.formOuvert = null;
  renderLieux();
});

registerAction('lieu-search', el => {
  lieuUI.recherche = el.value;
  const pos = el.selectionStart;
  renderLieux();
  const nouveau = document.querySelector('[data-action="lieu-search"]');
  if(nouveau){ nouveau.focus(); try{ nouveau.setSelectionRange(pos, pos); }catch(e){} }
});

registerAction('lieu-filter-statut', el => {
  lieuUI.statut = el.value;
  renderLieux();
});

registerAction('lieu-filter-reset', () => {
  lieuUI.statut = 'Toutes';
  lieuUI.recherche = '';
  renderLieux();
});

registerAction('lieu-new', () => {
  const cat = String(lieuUI.categorie).startsWith('proj:') ? 'reunion' : lieuUI.categorie;
  openSalleForm(null, cat, false);
  const slot = byId('salle-form-slot');
  if(slot) slot.scrollIntoView({ behavior:'smooth', block:'nearest' });
});

registerAction('lieu-edit', el => {
  const s = STATE.salles.find(x => x.id === el.dataset.id);
  if(!s) return;
  openSalleForm(s, s.categorie, false);
  const slot = byId('salle-form-slot');
  if(slot) slot.scrollIntoView({ behavior:'smooth', block:'nearest' });
});

registerAction('lieu-cancel', () => {
  lieuUI.formOuvert = null;
  renderLieux();
});

registerAction('lieu-add-contact', () => {
  const wrap = byId('contact-fields-wrap');
  if(!wrap) return;
  const div = document.createElement('div');
  div.innerHTML = contactRowHtml('', '');
  const row = div.firstElementChild;
  wrap.appendChild(row);
  const input = row.querySelector('.c-label-input');
  if(input) input.focus();
});

registerAction('lieu-remove-contact', el => {
  const row = el.closest('.contact-row');
  if(row) row.remove();
});

registerAction('lieu-save', el => {
  const nomInput = byId('f-nom-lieu');
  const nom = nomInput.value.trim();
  if(!nom){ showToast("Donnez un nom au lieu"); nomInput.focus(); return; }

  const contactFields = [];
  document.querySelectorAll('#contact-fields-wrap .contact-row').forEach(row => {
    const label = row.querySelector('.c-label-input').value.trim();
    const value = row.querySelector('.c-value-input').value.trim();
    // On garde la ligne dès qu'un des deux champs est rempli.
    if(label || value) contactFields.push({ label, value });
  });

  const projets = Array.from(document.querySelectorAll('.f-projet-cb'))
    .filter(cb => cb.checked).map(cb => cb.value);

  const val = {
    nom,
    ville:           byId('f-ville-lieu').value.trim(),
    categorie:       byId('f-cat-lieu').value,
    statut:          byId('f-statut-lieu').value,
    responsable:     byId('f-responsable-lieu').value,
    dateRelance:     byId('f-date-relance-lieu').value,
    prochaineAction: byId('f-prochaine-action-lieu').value.trim(),
    contactFields,
    projets
  };

  const existing = el.dataset.id ? STATE.salles.find(s => s.id === el.dataset.id) : null;
  if(existing){
    Object.assign(existing, val);
  } else {
    val.id = cryptoId();
    STATE.salles.push(val);
  }

  scheduleSave();
  lieuUI.formOuvert = null;
  showToast(existing ? "Lieu modifié" : "Lieu créé");

  // Si la catégorie a changé, on suit le lieu dans son nouvel onglet.
  if(!String(lieuUI.categorie).startsWith('proj:')) lieuUI.categorie = val.categorie;
  renderLieux();
  if(panelIsActive('kanban-salles')) renderKanbanSalles();
});

registerAction('lieu-delete', el => {
  const s = STATE.salles.find(x => x.id === el.dataset.id);
  if(!s) return;
  if(!confirmAction(`Supprimer le lieu « ${s.nom} » ?`)) return;

  // Mémorise la suppression pour qu'un lieu pré-rempli ne réapparaisse pas au rechargement.
  if(s.seed){
    const cle = s.categorie + '::' + s.nom;
    if(!STATE.meta.sallesSupprimees.includes(cle)) STATE.meta.sallesSupprimees.push(cle);
  }

  STATE.salles = STATE.salles.filter(x => x.id !== el.dataset.id);
  if(lieuUI.formOuvert === s.id) lieuUI.formOuvert = null;
  scheduleSave();
  showToast("Lieu supprimé");
  renderLieux();
  if(panelIsActive('kanban-salles')) renderKanbanSalles();
});

/* ==========================================================
   KANBAN SALLES
   ========================================================== */
const STATUTS_KANBAN = ['A contacter', 'En cours', 'Obtenu', 'Refusé', ''];

const kanbanUI = { categorie: 'toutes', recherche: '' };

function renderKanbanSalles(){
  const el = byId('kanban-salles');
  if(!el) return;

  const recherche = kanbanUI.recherche.toLowerCase().trim();
  const items = STATE.salles.filter(s => {
    if(kanbanUI.categorie !== 'toutes' && s.categorie !== kanbanUI.categorie) return false;
    if(recherche){
      const foin = [s.nom, s.ville, s.responsable].filter(Boolean).join(' ').toLowerCase();
      if(!foin.includes(recherche)) return false;
    }
    return true;
  });

  const catOpts = [
    ['toutes','Toutes catégories'], ['reunion','Salles Réunion'],
    ['metropole','Salles Métropole'], ['scolaire','Établissements scolaires']
  ].map(([v,l]) => `<option value="${v}" ${kanbanUI.categorie===v?'selected':''}>${l}</option>`).join('');

  mount(el, `
    <div class="row-head">
      <h2>Kanban Salles</h2>
      <span class="count-tag">Glissez-déposez les cartes, ou utilisez le menu de chaque carte</span>
    </div>

    <div class="filters">
      <input type="search" class="search-input" placeholder="Filtrer par nom, ville, responsable…"
             value="${esc(kanbanUI.recherche)}" aria-label="Filtrer les salles"
             data-action="kanban-search" data-on="input">
      <select aria-label="Filtrer par catégorie" data-action="kanban-cat" data-on="change">${catOpts}</select>
      <span class="count-tag">${items.length} carte(s)</span>
    </div>

    <div class="kanban-board">
      ${STATUTS_KANBAN.map(st => {
        const cartes = items.filter(s => (s.statut || '') === st);
        return `
        <div class="kanban-col" data-statut="${esc(st)}">
          <h3>${st || 'Sans statut'} <span class="pill">${cartes.length}</span></h3>
          <div class="kanban-items">
            ${cartes.length ? cartes.map(s => kanbanCardHtml(s)).join('') : '<div class="kanban-empty">Aucune salle</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>
  `);

  attachKanbanDnD(el);
}

function kanbanCardHtml(s){
  const opts = STATUTS_KANBAN.map(st =>
    `<option value="${esc(st)}" ${(s.statut||'')===st?'selected':''}>${st || 'Sans statut'}</option>`).join('');
  return `
    <div class="kanban-item" draggable="true" data-id="${esc(s.id)}">
      <div class="k-title">${esc(s.nom)}</div>
      <div class="k-meta">${esc(s.ville || '')}${s.responsable ? ' · ' + esc(s.responsable) : ''}</div>
      ${s.dateRelance ? `<div class="k-meta">Relance : ${formatDate(s.dateRelance)}</div>` : ''}
      <select class="k-move" aria-label="Changer le statut de ${esc(s.nom)}"
              data-action="kanban-set-statut" data-on="change" data-id="${esc(s.id)}">${opts}</select>
    </div>
  `;
}

/** Les listeners de glisser-déposer sont posés sur le conteneur fraîchement
 *  créé à chaque rendu ; aucun risque d'accumulation. */
function attachKanbanDnD(root){
  root.querySelectorAll('.kanban-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.dataset.id);
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      root.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
    });
  });

  root.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    col.addEventListener('dragenter', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', e => {
      // Ne retire le surlignage que si le curseur quitte réellement la colonne.
      if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      changerStatutSalle(id, col.dataset.statut);
    });
  });
}

function changerStatutSalle(id, nouveauStatut){
  if(!id) return;
  const salle = STATE.salles.find(s => s.id === id);
  if(!salle) return;
  if((salle.statut || '') === nouveauStatut) return;
  salle.statut = nouveauStatut;
  scheduleSave();
  showToast(`« ${salle.nom} » → ${nouveauStatut || 'Sans statut'}`);
  renderKanbanSalles();
  if(panelIsActive('lieux')) renderLieux();
}

registerAction('kanban-set-statut', el => changerStatutSalle(el.dataset.id, el.value));

registerAction('kanban-cat', el => {
  kanbanUI.categorie = el.value;
  renderKanbanSalles();
});

  renderKanbanSalles();

  if(nouveau){ nouveau.focus(); try{ nouveau.setSelectionRange(pos, pos); }catch(e){} }
});

   ========================================================== */
const ACT_TYPES = ['Répétition','Spectacle','Atelier','Réunion','Autre'];
const ACT_STATUTS = ['Prévue','Réalisée','Annulée'];

const activiteUI = { type: 'Tous', statut: 'Tous', recherche: '', formOuvert: null };

function renderActivites(){
  const el = byId('activites');
  if(!el) return;

  const recherche = activiteUI.recherche.toLowerCase().trim();
  let filtered = STATE.activites.filter(a => {
    if(activiteUI.type !== 'Tous' && a.type !== activiteUI.type) return false;
    if(activiteUI.statut !== 'Tous' && a.statut !== activiteUI.statut) return false;
    if(recherche){
      const foin = [a.nom, a.lieu, a.responsable, a.partenaires, a.notes].filter(Boolean).join(' ').toLowerCase();
      if(!foin.includes(recherche)) return false;
    }
    return true;
  });
  filtered.sort((a,b)=> (b.date || '').localeCompare(a.date || ''));

  const statutOpts = ['Tous', ...ACT_STATUTS]
    .map(s => `<option value="${esc(s)}" ${activiteUI.statut===s?'selected':''}>${s}</option>`).join('');

  mount(el, `
    <div class="row-head">
      <h2>Activités</h2>
      <div class="head-right">
        <span class="count-tag">${filtered.length} / ${STATE.activites.length}</span>
        <button type="button" class="btn" data-action="activite-new">+ Nouvelle activité</button>
      </div>
    </div>

    <div class="sub-tabs" role="tablist">
      ${['Tous', ...ACT_TYPES].map(t => `
        <button type="button" class="sub-tab ${activiteUI.type === t ? 'active' : ''}"
                role="tab" aria-selected="${activiteUI.type === t}"
                data-action="activite-type" data-type="${esc(t)}">
          ${t}
          <span class="pill">${t==='Tous' ? STATE.activites.length : STATE.activites.filter(a=>a.type===t).length}</span>
        </button>`).join('')}
    </div>

    <div class="filters">
      <input type="search" class="search-input" placeholder="Rechercher une activité, un lieu…"
             value="${esc(activiteUI.recherche)}" aria-label="Rechercher une activité"
             data-action="activite-search" data-on="input">
      <select aria-label="Filtrer par statut" data-action="activite-filter-statut" data-on="change">${statutOpts}</select>
      ${(activiteUI.statut!=='Tous' || activiteUI.recherche || activiteUI.type!=='Tous')
        ? `<button type="button" class="btn small secondary" data-action="activite-filter-reset">Réinitialiser</button>` : ''}
    </div>

    <div id="activite-form-slot"></div>

    <div class="list">
      ${filtered.length
        ? filtered.map(activiteItemHtml).join('')
        : `<div class="empty">${STATE.activites.length === 0
            ? "Aucune activité. Créez-en une ici ou depuis le planning."
            : "Aucune activité ne correspond à ces filtres."}</div>`}
    </div>
  `);

  if(activiteUI.formOuvert){
    const existing = activiteUI.formOuvert === 'new'
      ? null : STATE.activites.find(a => a.id === activiteUI.formOuvert);
    if(activiteUI.formOuvert === 'new' || existing) openActiviteForm(existing, true);
    else activiteUI.formOuvert = null;
  }
}

function activiteItemHtml(a){
  const horaire = (a.heureDebut || a.heureFin)
    ? `${esc(a.heureDebut||'')}${a.heureDebut && a.heureFin ? '–' : ''}${esc(a.heureFin||'')}` : '';
  const periode = (a.dateFin && a.dateFin !== a.date) ? ` → ${formatDate(a.dateFin)}` : '';
  return `
    <div class="item ${statusClass('activite', a.statut)}">
      <div class="main">
        <div class="title">${esc(a.nom)}</div>
        <div class="meta">
          ${a.date ? `<span>${formatDate(a.date)}${periode}</span>` : ''}
          ${horaire ? `<span>${horaire}</span>` : ''}
          <span>${esc(a.type)}</span>
          ${a.lieu ? `<span>${esc(a.lieu)}</span>` : ''}
          ${a.duree ? `<span>Durée : ${esc(a.duree)}</span>` : ''}
          ${a.participants ? `<span>${esc(a.participants)} participant(s)</span>` : ''}
          ${a.public ? `<span>${esc(a.public)} personne(s) touchée(s)</span>` : ''}
          ${a.responsable ? `<span>Responsable : ${esc(a.responsable)}</span>` : ''}
          <span class="status-label">${esc(a.statut)}</span>
        </div>
        ${a.notes ? `<div class="desc">${esc(a.notes)}</div>` : ''}
      </div>
      <div class="actions">
        <button type="button" class="btn small secondary" data-action="activite-edit" data-id="${esc(a.id)}">Modifier</button>
        <button type="button" class="btn small danger" data-action="activite-delete" data-id="${esc(a.id)}">Suppr.</button>
      </div>
    </div>
  `;
}

function openActiviteForm(existing, dejaOuvert){
  const slot = byId('activite-form-slot');
  if(!slot) return;

  if(!dejaOuvert) activiteUI.formOuvert = existing ? existing.id : 'new';

  const a = existing || {
    nom:'', date: toLocalDateStr(new Date()), dateFin:'', type:'Répétition',
    lieu:'', lieuType:'autre', lieuCustom:'', statut:'Prévue',
    participants:'', public:'', duree:'', heureDebut:'', heureFin:'',
    partenaires:'', responsable:'', fonctionne:'', difficultes:'', notes:'',
    annee: String(new Date().getFullYear())
  };

  // Liste réelle des salles, plus un choix libre.
  const groupes = [
    { label: 'Salles Réunion',           cat: 'reunion'   },
    { label: 'Salles Métropole',         cat: 'metropole' },
    { label: 'Établissements scolaires', cat: 'scolaire'  }
  ];
  const connu = STATE.salles.some(s => s.nom === a.lieu);
  let lieuOptions = `<option value="">— Aucun —</option>`;
  groupes.forEach(g => {
    const items = STATE.salles.filter(s => s.categorie === g.cat);
    if(!items.length) return;
    lieuOptions += `<optgroup label="${esc(g.label)}">`;
    items.forEach(s => {
      lieuOptions += `<option value="${esc(s.nom)}" ${a.lieu === s.nom ? 'selected' : ''}>${esc(s.nom)}</option>`;
    });
    lieuOptions += `</optgroup>`;
  });
  const libreSelected = (a.lieu && !connu) ? 'selected' : '';
  lieuOptions += `<option value="__autre__" ${libreSelected}>Autre (saisie libre)</option>`;

  mount(slot, `
    <div class="form-card">
      <h3>${existing ? "Modifier l'activité" : 'Nouvelle activité'}</h3>
      <div class="form-grid">
        <label class="full">Nom <span class="req">*</span>
          <input type="text" id="f-nom-act" value="${esc(a.nom)}" placeholder="Ex : Répétition Studio A">
        </label>
        <label>Date de début
          <input type="date" id="f-date-act" value="${esc(a.date)}">
        </label>
        <label>Date de fin (si période)
          <input type="date" id="f-date-fin-act" value="${esc(a.dateFin)}">
        </label>
        <label>Type
          <select id="f-type-act">${ACT_TYPES.map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}</select>
        </label>
        <label>Statut
          <select id="f-statut-act">${ACT_STATUTS.map(s=>`<option ${a.statut===s?'selected':''}>${s}</option>`).join('')}</select>
        </label>
        <label>Lieu
          <select id="f-lieu-act" data-action="activite-lieu-change" data-on="change">${lieuOptions}</select>
        </label>
        <label id="f-lieu-custom-wrap" ${libreSelected ? '' : 'hidden'}>Lieu personnalisé
          <input type="text" id="f-lieu-custom-act" value="${esc(connu ? a.lieuCustom : a.lieu)}" placeholder="Nom du lieu">
        </label>
        <label>Heure de début
          <input type="time" id="f-heure-debut-act" value="${esc(a.heureDebut)}">
        </label>
        <label>Heure de fin
          <input type="time" id="f-heure-fin-act" value="${esc(a.heureFin)}">
        </label>
        <label>Durée
          <input type="text" id="f-duree-act" value="${esc(a.duree)}" placeholder="Ex : 2:00">
        </label>
        <label>Participants
          <input type="number" id="f-participants-act" value="${esc(a.participants)}" min="0" placeholder="0">
        </label>
        <label>Public touché
          <input type="number" id="f-public-act" value="${esc(a.public)}" min="0" placeholder="0">
        </label>
        <label>Responsable
          <select id="f-responsable-act">${membreOptions(a.responsable)}</select>
        </label>
        <label>Partenaires
          <input type="text" id="f-partenaires-act" value="${esc(a.partenaires)}">
        </label>
        <label class="full">Ce qui a fonctionné
          <textarea id="f-fonctionne-act" rows="2">${esc(a.fonctionne)}</textarea>
        </label>
        <label class="full">Difficultés / points à améliorer
          <textarea id="f-difficultes-act" rows="2">${esc(a.difficultes)}</textarea>
        </label>
        <label class="full">Notes / observations
          <textarea id="f-notes-act" rows="2">${esc(a.notes)}</textarea>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-action="activite-save" data-id="${esc(existing ? existing.id : '')}">Enregistrer</button>
        <button type="button" class="btn secondary" data-action="activite-cancel">Annuler</button>

registerAction('activite-lieu-change', el => {

  if(wrap) wrap.hidden = (el.value !== '__autre__');
  if(el.value === '__autre__'){
    const input = byId('f-lieu-custom-act');
    if(input) input.focus();
  }
});

registerAction('activite-save', el => {
  const nomInput = byId('f-nom-act');
  const nom = nomInput.value.trim();
  if(!nom){ showToast("Donnez un nom à l'activité"); nomInput.focus(); return; }

  const date = byId('f-date-act').value;
  const dateFin = byId('f-date-fin-act').value;
  if(dateFin && date && dateFin < date){ showToast("La date de fin précède la date de début"); return; }

  const heureDebut = byId('f-heure-debut-act').value;
  const heureFin = byId('f-heure-fin-act').value;
  if(heureDebut && heureFin && !dateFin && heureFin < heureDebut){
    showToast("L'heure de fin précède l'heure de début"); return;
  }

  const lieuSel = byId('f-lieu-act').value;
  const lieuCustom = byId('f-lieu-custom-act').value.trim();
  let lieu = '', lieuType = 'autre';
  if(lieuSel === '__autre__'){
    lieu = lieuCustom;
  } else if(lieuSel){
    lieu = lieuSel;
    const found = STATE.salles.find(s => s.nom === lieuSel);
    if(found) lieuType = found.categorie || 'autre';
  }

  let duree = byId('f-duree-act').value.trim();
  if(!duree && heureDebut && heureFin){
    const [h1,m1] = heureDebut.split(':').map(Number);
    const [h2,m2] = heureFin.split(':').map(Number);
    const diff = (h2*60+m2) - (h1*60+m1);
    if(diff > 0) duree = `${Math.floor(diff/60)}:${String(diff%60).padStart(2,'0')}`;
  }

  const val = {
    nom, date, dateFin: dateFin || '',
    type:         byId('f-type-act').value,
    statut:       byId('f-statut-act').value,
    lieu, lieuType,
    lieuCustom:   (lieuSel === '__autre__') ? lieuCustom : '',
    heureDebut, heureFin, duree,
    participants: byId('f-participants-act').value,
    public:       byId('f-public-act').value,
    responsable:  byId('f-responsable-act').value,
    partenaires:  byId('f-partenaires-act').value.trim(),
    fonctionne:   byId('f-fonctionne-act').value.trim(),
    difficultes:  byId('f-difficultes-act').value.trim(),
    notes:        byId('f-notes-act').value.trim(),
    annee:        date ? date.slice(0,4) : String(new Date().getFullYear())
  };

  const existing = el.dataset.id ? STATE.activites.find(a => a.id === el.dataset.id) : null;
  if(existing) Object.assign(existing, val);
  else { val.id = cryptoId(); STATE.activites.push(val); }

  scheduleSave();
  activiteUI.formOuvert = null;
  showToast(existing ? "Activité modifiée" : "Activité créée");
  renderActivites();
  refreshPlanning();
});

registerAction('activite-delete', el => {
  const a = STATE.activites.find(x => x.id === el.dataset.id);
  if(!a) return;
  if(!confirmAction(`Supprimer l'activité « ${a.nom} » ?`)) return;
  STATE.activites = STATE.activites.filter(x => x.id !== el.dataset.id);
  if(activiteUI.formOuvert === a.id) activiteUI.formOuvert = null;
  scheduleSave();
  showToast("Activité supprimée");
  renderActivites();
  refreshPlanning();
});

/* ==========================================================
   BILAN
   ========================================================== */
let bilanYear = null;

function renderBilan(){
  const el = byId('bilan');
  if(!el) return;

  const years = Array.from(new Set(STATE.activites.map(a => a.annee).filter(Boolean))).sort().reverse();
  const anneeCourante = String(new Date().getFullYear());
  if(!years.includes(anneeCourante)) years.unshift(anneeCourante);
  if(!bilanYear || !years.includes(bilanYear)) bilanYear = years[0];

  mount(el, `
    <div class="row-head">
      <h2>Bilan</h2>
      <select aria-label="Année du bilan" data-action="bilan-year" data-on="change">
        ${years.map(y => `<option ${y===bilanYear?'selected':''}>${y}</option>`).join('')}
      </select>
    </div>

    <div id="bilan-content"></div>

    <div class="bilan-detailed">
      <h3>Bilan détaillé sur une période</h3>
      <div class="filters">
        <label class="inline-label">Du <input type="date" id="bilan-start" value="${bilanYear}-01-01"></label>
        <label class="inline-label">Au <input type="date" id="bilan-end" value="${bilanYear}-12-31"></label>
        <button type="button" class="btn" data-action="bilan-generate">Générer</button>
        <button type="button" class="btn secondary" data-action="bilan-export-csv">Exporter en CSV</button>
      </div>
      <div id="bilan-detailed-result"></div>
    </div>
  `);

  renderBilanContent(bilanYear);
}

function renderBilanContent(year){
  const el = byId('bilan-content');
  if(!el) return;

  const acts = STATE.activites.filter(a => (a.annee || '') === year);
  const realisees = acts.filter(a => a.statut === 'Réalisée');
  const prevues = acts.filter(a => a.statut === 'Prévue');
  const annulees = acts.filter(a => a.statut === 'Annulée');

  const totalParticipants = realisees.reduce((s,a) => s + (parseInt(a.participants,10) || 0), 0);
  const totalPublic = realisees.reduce((s,a) => s + (parseInt(a.public,10) || 0), 0);
  const totalMinutes = realisees.reduce((s,a) => s + dureeEnMinutes(a.duree), 0);

  const byType = {};
  realisees.forEach(a => { byType[a.type] = (byType[a.type] || 0) + 1; });

  const sallesObtenues = STATE.salles.filter(s => s.statut === 'Obtenu').length;
  const tachesOuvertes = STATE.taches.filter(t => t.statut !== 'Fait').length;

  mount(el, `
    <div class="stats-grid">
      <div class="stat"><div class="num">${realisees.length}</div><div class="label">Activités réalisées</div></div>
      <div class="stat"><div class="num">${totalParticipants}</div><div class="label">Participants cumulés</div></div>
      <div class="stat"><div class="num">${totalPublic}</div><div class="label">Public touché</div></div>
      <div class="stat"><div class="num">${formatMinutes(totalMinutes)}</div><div class="label">Durée cumulée</div></div>
      <div class="stat"><div class="num">${sallesObtenues}</div><div class="label">Salles obtenues</div></div>
      <div class="stat"><div class="num">${tachesOuvertes}</div><div class="label">Tâches en cours</div></div>
    </div>

    <div class="bilan-section">
      <h3>Répartition par type</h3>
      ${Object.keys(byType).length
        ? `<div class="repartition">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,n])=>{
            const pct = Math.round(n / realisees.length * 100);
            return `<div class="rep-row">
              <span class="rep-label">${esc(t)}</span>
              <span class="rep-bar"><span class="rep-fill" style="width:${pct}%"></span></span>
              <span class="rep-num">${n}</span>
            </div>`;
          }).join('')}</div>`
        : '<div class="empty">Aucune activité réalisée cette année.</div>'}
    </div>

    <div class="bilan-section">
      <h3>Suivi des statuts</h3>
      <div class="meta spread">
        <span>Prévues : ${prevues.length}</span>
        <span>Réalisées : ${realisees.length}</span>
        <span>Annulées : ${annulees.length}</span>
      </div>
    </div>

    <div class="bilan-section">
      <h3>Ce qui a fonctionné</h3>
      ${realisees.filter(a=>a.fonctionne).length
        ? realisees.filter(a=>a.fonctionne).map(a => `<div class="quote-block"><strong>${esc(a.nom)}</strong> — ${esc(a.fonctionne)}</div>`).join('')
        : '<div class="empty">Rien de noté pour l\'instant.</div>'}
    </div>

    <div class="bilan-section">
      <h3>Difficultés &amp; points à améliorer</h3>
      ${realisees.filter(a=>a.difficultes).length
        ? realisees.filter(a=>a.difficultes).map(a => `<div class="quote-block"><strong>${esc(a.nom)}</strong> — ${esc(a.difficultes)}</div>`).join('')
        : '<div class="empty">Rien de noté pour l\'instant.</div>'}
    </div>
  `);
}

function activitesSurPeriode(start, end){
  return STATE.activites.filter(a => {
    if(!a.date) return false;
    const fin = a.dateFin || a.date;
    return a.date <= end && fin >= start;
  }).sort((a,b) => (a.date || '').localeCompare(b.date || ''));
}

function generateDetailedBilan(start, end){
  const resultDiv = byId('bilan-detailed-result');
  if(!resultDiv) return;

  const activities = activitesSurPeriode(start, end);
  if(activities.length === 0){
    mount(resultDiv, `<div class="empty">Aucune activité sur cette période.</div>`);
    return;
  }

  const byType = {}, byLieu = {}, byResponsable = {};
  let totalParticipants = 0, totalPublic = 0, totalMinutes = 0;

  activities.forEach(a => {
    byType[a.type] = (byType[a.type] || 0) + 1;
    byLieu[a.lieu || 'Non défini'] = (byLieu[a.lieu || 'Non défini'] || 0) + 1;
    if(a.responsable) byResponsable[a.responsable] = (byResponsable[a.responsable] || 0) + 1;
    totalParticipants += parseInt(a.participants,10) || 0;
    totalPublic += parseInt(a.public,10) || 0;
    totalMinutes += dureeEnMinutes(a.duree);
  });

  const listeHtml = obj => Object.entries(obj).sort((a,b)=>b[1]-a[1])
    .map(([k,n]) => `<div class="meta">${esc(k)} : <strong>${n}</strong></div>`).join('');

  mount(resultDiv, `
    <div class="bilan-result">
      <h4>Du ${formatDate(start)} au ${formatDate(end)}</h4>
      <div class="stats-grid">
        <div class="stat"><div class="num">${activities.length}</div><div class="label">Activités</div></div>
        <div class="stat"><div class="num">${totalParticipants}</div><div class="label">Participants</div></div>
        <div class="stat"><div class="num">${totalPublic}</div><div class="label">Public touché</div></div>
        <div class="stat"><div class="num">${formatMinutes(totalMinutes)}</div><div class="label">Durée totale</div></div>
      </div>

      <div class="repartition-cols">
        <div><h4>Par type</h4>${listeHtml(byType)}</div>
        <div><h4>Par lieu</h4>${listeHtml(byLieu)}</div>
        ${Object.keys(byResponsable).length ? `<div><h4>Par responsable</h4>${listeHtml(byResponsable)}</div>` : ''}
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Date</th><th>Nom</th><th>Type</th><th>Lieu</th>
            <th>Part.</th><th>Public</th><th>Durée</th><th>Statut</th><th>Responsable</th>
          </tr></thead>
          <tbody>
            ${activities.map(a => `
              <tr>
                <td>${formatDate(a.date)}${a.dateFin && a.dateFin !== a.date ? ' → ' + formatDate(a.dateFin) : ''}</td>
                <td>${esc(a.nom)}</td>
                <td>${esc(a.type)}</td>
                <td>${esc(a.lieu || '')}</td>
                <td>${esc(a.participants || '')}</td>
                <td>${esc(a.public || '')}</td>
                <td>${esc(a.duree || '')}</td>
                <td>${esc(a.statut)}</td>
                <td>${esc(a.responsable || '')}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `);
}

registerAction('bilan-year', el => {
  bilanYear = el.value;
  renderBilanContent(bilanYear);
  const s = byId('bilan-start'), e = byId('bilan-end');
  if(s) s.value = `${bilanYear}-01-01`;
  if(e) e.value = `${bilanYear}-12-31`;
});

registerAction('bilan-generate', () => {
  const start = byId('bilan-start').value;
  const end = byId('bilan-end').value;
  if(!start || !end){ showToast("Sélectionnez une période complète"); return; }
  if(end < start){ showToast("La date de fin précède la date de début"); return; }
  generateDetailedBilan(start, end);
});

registerAction('bilan-export-csv', () => {
  const start = byId('bilan-start').value;
  const end = byId('bilan-end').value;
  if(!start || !end){ showToast("Sélectionnez une période complète"); return; }

  const activities = activitesSurPeriode(start, end);
  if(!activities.length){ showToast("Aucune activité sur cette période"); return; }

  const champ = v => {
    const s = String(v === undefined || v === null ? '' : v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lignes = [
    ['Date début','Date fin','Nom','Type','Lieu','Participants','Public','Durée','Statut','Responsable','Partenaires','Notes'],
    ...activities.map(a => [
      a.date, a.dateFin || '', a.nom, a.type, a.lieu || '',
      a.participants || '', a.public || '', a.duree || '',
      a.statut, a.responsable || '', a.partenaires || '', a.notes || ''
    ])
  ];
  // Point-virgule et BOM : ouverture directe dans Excel en français.
  const csv = '\uFEFF' + lignes.map(l => l.map(champ).join(';')).join('\r\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cie3-bilan-${start}_${end}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('Export CSV téléchargé');
});

/* ==========================================================
   MEMBRES
   ========================================================== */
let selectedMemberId = null;
let membreFormOuvert = null;   // null | 'new' | id du membre

function renderMembres(){
  const el = byId('membres');
  if(!el) return;

  mount(el, `
    <div class="row-head">
      <h2>Membres</h2>
      <div class="head-right">
        <span class="count-tag">${STATE.membres.length} membre(s)</span>
        <button type="button" class="btn" data-action="membre-new">+ Nouveau membre</button>
      </div>
    </div>

    <div id="membre-form-slot"></div>

    <div class="members-list">
      ${STATE.membres.length ? STATE.membres.map(m => {
        const nom = memberName(m);
        const taches = STATE.taches.filter(t => t.responsable === nom);
        const ouvertes = taches.filter(t => t.statut !== 'Fait').length;
        return `
        <div class="member-row ${selectedMemberId === m.id ? 'is-selected' : ''}">
          <div>
            <div class="m-name">${esc(nom)}</div>
            <div class="m-role">${esc(m.role || '')}</div>
          </div>
          <div class="m-actions">
            <span class="count-tag">${ouvertes} tâche(s) en cours</span>
            <button type="button" class="btn small secondary" data-action="membre-tasks" data-id="${esc(m.id)}">
              ${selectedMemberId === m.id ? 'Masquer' : 'Voir ses tâches'}
            </button>
            <button type="button" class="btn small secondary" data-action="membre-edit" data-id="${esc(m.id)}">Modifier</button>
            <button type="button" class="btn small danger" data-action="membre-delete" data-id="${esc(m.id)}">Suppr.</button>
          </div>
        </div>`;
      }).join('') : '<div class="empty">Aucun membre. Ajoutez les personnes de la compagnie pour pouvoir leur attribuer des tâches.</div>'}
    </div>

    <div class="member-tasks-section">
      <h3>Tâches par membre</h3>
      <div id="member-tasks-content">
        ${selectedMemberId
          ? renderTasksForMember(selectedMemberId)
          : '<div class="empty">Cliquez sur « Voir ses tâches » pour afficher le détail.</div>'}
      </div>
    </div>
  `);

  if(membreFormOuvert){
    const existing = membreFormOuvert === 'new' ? null : STATE.membres.find(m => m.id === membreFormOuvert);
    if(membreFormOuvert === 'new' || existing) openMembreForm(existing, true);
    else membreFormOuvert = null;
  }
}

function renderTasksForMember(memberId){
  const m = STATE.membres.find(x => x.id === memberId);
  if(!m) return '<div class="empty">Membre introuvable.</div>';
  const nom = memberName(m);

  const tasks = STATE.taches.filter(t => t.responsable === nom);
  if(tasks.length === 0){
    return `<div class="empty">Aucune tâche attribuée à ${esc(nom)}.</div>`;
  }

  const stats = { 'À faire':0, 'En cours':0, 'Fait':0 };
  tasks.forEach(t => { if(stats[t.statut] !== undefined) stats[t.statut]++; });

  tasks.sort((a,b)=>{
    const r = (a.statut === 'Fait' ? 1 : 0) - (b.statut === 'Fait' ? 1 : 0);
    if(r !== 0) return r;
    return (a.dateLimite || '9999-99-99').localeCompare(b.dateLimite || '9999-99-99');
  });

  return `
    <div class="member-tasks-head"><strong>${esc(nom)}</strong> — ${tasks.length} tâche(s)</div>
    <div class="task-stats">
      <span class="task-stat-a-faire">À faire : ${stats['À faire']}</span>
      <span class="task-stat-en-cours">En cours : ${stats['En cours']}</span>
      <span class="task-stat-fait">Fait : ${stats['Fait']}</span>
    </div>
    <div class="member-tasks-list">
      ${tasks.map(t => {
        const retard = estEnRetard(t);
        return `
        <div class="item ${statusClass('tache', t.statut)} ${retard ? 'is-late' : ''}">
          <div class="main">
            <div class="title">${esc(t.tache)}</div>
            <div class="meta">
              ${t.projet ? `<span>Projet : ${esc(t.projet)}</span>` : ''}
              ${t.dateLimite ? `<span class="${retard ? 'warn' : ''}">Échéance : ${formatDate(t.dateLimite)}${retard ? ' ⚠' : ''}</span>` : ''}
              ${t.priorite ? `<span>Priorité : ${esc(t.priorite)}</span>` : ''}
              <span class="status-label">${esc(t.statut)}</span>
            </div>
            ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ''}
            ${t.commentaire ? `<div class="desc note">💬 ${esc(t.commentaire)}</div>` : ''}
          </div>
          <div class="actions">
            <button type="button" class="btn small secondary" data-action="membre-task-toggle" data-id="${esc(t.id)}">
              ${t.statut === 'Fait' ? 'Rouvrir' : 'Marquer fait'}
            </button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function openMembreForm(existing, dejaOuvert){
  const slot = byId('membre-form-slot');
  if(!slot) return;

  if(!dejaOuvert) membreFormOuvert = existing ? existing.id : 'new';
  const m = existing || { prenom:'', nom:'', role:'' };

  mount(slot, `
    <div class="form-card">
      <h3>${existing ? 'Modifier le membre' : 'Nouveau membre'}</h3>
      <div class="form-grid">
        <label>Prénom <input type="text" id="f-prenom-m" value="${esc(m.prenom)}"></label>
        <label>Nom <input type="text" id="f-nom-m" value="${esc(m.nom)}"></label>
        <label class="full">Rôle <input type="text" id="f-role-m" value="${esc(m.role)}" placeholder="Ex : Chorégraphe, interprète"></label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-action="membre-save" data-id="${esc(existing ? existing.id : '')}">Enregistrer</button>
        <button type="button" class="btn secondary" data-action="membre-cancel">Annuler</button>
      </div>
    </div>
  `);

  const first = slot.querySelector('#f-prenom-m');
  if(first && !dejaOuvert) first.focus();
}

/* ---------- Actions ---------- */
registerAction('membre-new', () => openMembreForm(null, false));

registerAction('membre-edit', el => {
  const m = STATE.membres.find(x => x.id === el.dataset.id);
  if(m) openMembreForm(m, false);
});

registerAction('membre-cancel', () => {
  membreFormOuvert = null;
  renderMembres();
});

registerAction('membre-save', el => {
  const prenom = byId('f-prenom-m').value.trim();
  const nom = byId('f-nom-m').value.trim();
  const role = byId('f-role-m').value.trim();
  if(!prenom && !nom){ showToast("Indiquez au moins un prénom ou un nom"); return; }

  const existing = el.dataset.id ? STATE.membres.find(m => m.id === el.dataset.id) : null;

  if(existing){
    const ancienNom = memberName(existing);
    Object.assign(existing, { prenom, nom, role });
    const nouveauNom = memberName(existing);
    // Répercute le changement de nom sur les tâches et activités liées.
    if(ancienNom !== nouveauNom){
      STATE.taches.forEach(t => { if(t.responsable === ancienNom) t.responsable = nouveauNom; });
      STATE.activites.forEach(a => { if(a.responsable === ancienNom) a.responsable = nouveauNom; });
      STATE.salles.forEach(s => { if(s.responsable === ancienNom) s.responsable = nouveauNom; });
      if(tacheUI.membre === ancienNom) tacheUI.membre = nouveauNom;
    }
  } else {
    STATE.membres.push({ id: cryptoId(), prenom, nom, role });
  }

  scheduleSave();
  membreFormOuvert = null;
  showToast(existing ? "Membre modifié" : "Membre ajouté");
  renderMembres();
});

registerAction('membre-delete', el => {
  const m = STATE.membres.find(x => x.id === el.dataset.id);
  if(!m) return;
  const nom = memberName(m);
  const nbTaches = STATE.taches.filter(t => t.responsable === nom).length;
  const msg = nbTaches
    ? `Supprimer ${nom} ?\n${nbTaches} tâche(s) resteront mais sans responsable.`
    : `Supprimer ${nom} ?`;
  if(!confirmAction(msg)) return;

  STATE.taches.forEach(t => { if(t.responsable === nom) t.responsable = ''; });
  STATE.membres = STATE.membres.filter(x => x.id !== m.id);
  if(selectedMemberId === m.id) selectedMemberId = null;
  if(membreFormOuvert === m.id) membreFormOuvert = null;
  if(tacheUI.membre === nom) tacheUI.membre = 'Tous';

  scheduleSave();
  showToast("Membre supprimé");
  renderMembres();
});

registerAction('membre-tasks', el => {
  selectedMemberId = (selectedMemberId === el.dataset.id) ? null : el.dataset.id;
  renderMembres();
});

registerAction('membre-task-toggle', el => {
  const t = STATE.taches.find(x => x.id === el.dataset.id);
  if(!t) return;
  t.statut = (t.statut === 'Fait') ? 'À faire' : 'Fait';
  scheduleSave();
  showToast(`« ${t.tache} » ${t.statut === 'Fait' ? 'terminée' : 'rouverte'}`);
  renderMembres();
});

/* ==========================================================
   INITIALISATION
   ========================================================== */
async function init(){
  try{
    await loadState();

    // Un premier lancement sans données ouvre l'accueil ; sinon on reprend
    // le dernier onglet consulté.
    const dernier = STATE.meta && STATE.meta.dernierOnglet;
    activeTabId = (dernier && STATE.tabs.some(t => t.id === dernier)) ? dernier : STATE.tabs[0].id;

    rebuildPanels();
    renderTabs();
    switchTab(activeTabId);

    updateSaveIndicator(STATE.meta.derniereSauvegarde ? 'saved' : 'pending');

    if(!HAS_CLOUD_STORAGE){
      const bandeau = byId('storage-note');
      if(bandeau){
        bandeau.hidden = false;
        bandeau.textContent = "Les données sont enregistrées dans ce navigateur uniquement. Pensez à exporter une sauvegarde régulièrement.";
      }
    }
  }catch(err){
    showErrorBanner((err && err.stack) ? err.stack : String(err));
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
