<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cie 3.0 — Organisation + Planning avancé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #EDEEE4;
      --bg-panel: #F7F7F1;
      --ink: #221A2E;
      --ink-soft: #5B5468;
      --line: #D9D8CB;
      --primary: #A5325C;
      --primary-dark: #7E2647;
      --teal: #2F7A6B;
      --ochre: #B8842B;
      --grey-status: #8A8578;
      --danger: #B23A3A;
    }
    *{ box-sizing: border-box; }
    html,body{ margin:0; padding:0; }
    body{
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    h1,h2,h3{
      font-family: 'Fraunces', serif;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.2px;
    }
    #root{ max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }

    .masthead{
      display:flex; align-items:baseline; justify-content:space-between;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 14px; margin-bottom: 6px;
      flex-wrap: wrap; gap: 8px;
    }
    .masthead h1{ font-size: 30px; }
    .masthead .tagline{ font-size: 13px; color: var(--ink-soft); font-style: italic; }

    .tabs-wrapper{
      display:flex;
      align-items: center;
      gap: 4px;
      margin: 18px 0 28px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
      padding-bottom: 2px;
    }
    .tabs-wrapper .tab-item{
      display:flex;
      align-items:center;
      gap:4px;
      background:none;
      border:none;
      cursor:pointer;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--ink-soft);
      padding: 10px 8px 12px;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      position:relative;
      transition: color 0.2s;
    }
    .tabs-wrapper .tab-item.active{
      color: var(--ink);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }
    .tabs-wrapper .tab-item .tab-actions{
      display:inline-flex;
      gap:2px;
      margin-left:4px;
      font-size:12px;
      color:var(--ink-soft);
    }
    .tabs-wrapper .tab-item .tab-actions span{
      cursor:pointer;
      padding:0 3px;
      border-radius:2px;
      transition: background 0.2s;
    }
    .tabs-wrapper .tab-item .tab-actions span:hover{
      background:var(--line);
    }
    .tabs-wrapper .tab-item .tab-actions .del-tab:hover{
      color:var(--danger);
    }
    .tabs-wrapper .add-tab-btn{
      background:none;
      border:none;
      cursor:pointer;
      font-size:20px;
      color:var(--ink-soft);
      padding:4px 8px;
      margin-left:4px;
      line-height:1;
      border-radius:3px;
      transition: background 0.2s;
    }
    .tabs-wrapper .add-tab-btn:hover{
      background:var(--line);
    }
    .tabs-wrapper .add-project-tab-btn{
      background:none;
      border:1px dashed var(--primary);
      border-radius:3px;
      cursor:pointer;
      font-size:13px;
      color:var(--primary);
      padding:6px 12px;
      margin-left:6px;
      transition: background 0.2s;
      white-space:nowrap;
    }
    .tabs-wrapper .add-project-tab-btn:hover{
      background:var(--primary);
      color:#fff;
    }

    .panel{ display:none; }
    .panel.active{ display:block; }

    .row-head{
      display:flex; justify-content: space-between; align-items:center;
      margin-bottom: 14px; gap: 12px; flex-wrap: wrap;
    }
    .row-head h2{ font-size: 21px; }
    .count-tag{ color: var(--ink-soft); font-size: 13px; }

    .btn{
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--ink); color: #fff; border: none;
      padding: 9px 16px; border-radius: 3px; cursor: pointer;
      font-size: 13.5px; font-weight: 500;
    }
    .btn:hover{ background: var(--primary-dark); }
    .btn.secondary{
      background: transparent; color: var(--ink); border: 1px solid var(--ink);
    }
    .btn.secondary:hover{ background: var(--ink); color:#fff; }
    .btn.small{ padding: 5px 10px; font-size: 12.5px; }
    .btn.danger{ background: var(--danger); }

    .filters{ display:flex; gap:10px; margin-bottom: 16px; flex-wrap:wrap; align-items:center; }
    select, input[type=text], input[type=date], input[type=number], input[type=time], textarea{
      font-family: 'IBM Plex Sans', sans-serif;
      border: 1px solid var(--line); border-radius: 3px;
      padding: 7px 9px; font-size: 13.5px; background: #fff; color: var(--ink);
    }
    select{ cursor:pointer; }
    textarea{ width:100%; resize: vertical; min-height: 50px; }

    .form-card{
      background: var(--bg-panel);
      border: 1px solid var(--line);
      padding: 18px; margin-bottom: 20px; border-radius: 4px;
    }
    .form-card h3{ font-size: 15px; margin-bottom: 12px; }
    .form-grid{
      display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px 14px; margin-bottom: 12px;
    }
    .form-grid label{
      display:flex; flex-direction:column; gap:4px; font-size: 12.5px; color: var(--ink-soft);
    }
    .form-grid .full{ grid-column: 1 / -1; }
    .form-actions{ display:flex; gap:8px; }

    .list{ display:flex; flex-direction:column; }
    .item{
      display:flex; justify-content:space-between; align-items:flex-start;
      gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--line);
      border-left: 3px solid var(--grey-status); padding-left: 14px;
    }
    .item.status-a-contacter{ border-left-color: var(--grey-status); }
    .item.status-en-cours{ border-left-color: var(--ochre); }
    .item.status-obtenu{ border-left-color: var(--teal); }
    .item.status-refuse{ border-left-color: var(--danger); }
    .item.status-a-faire{ border-left-color: var(--grey-status); }
    .item.status-en-cours-t{ border-left-color: var(--ochre); }
    .item.status-fait{ border-left-color: var(--teal); }
    .item.status-prevue{ border-left-color: var(--ochre); }
    .item.status-realisee{ border-left-color: var(--teal); }
    .item.status-annulee{ border-left-color: var(--danger); }
    .item.status-sans-statut{ border-left-color: var(--grey-status); }

    .item .main{ flex:1; min-width: 220px; }
    .item .title{ font-weight: 600; font-size: 15px; margin-bottom: 3px; }
    .item .meta{ font-size: 12.5px; color: var(--ink-soft); display:flex; flex-wrap:wrap; gap: 4px 10px; margin-bottom: 4px; }
    .item .desc{ font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
    .item .status-label{
      font-size: 12px; font-weight: 600; text-transform: none;
    }
    .item .actions{ display:flex; gap:6px; flex-shrink:0; }

    .empty{
      padding: 40px 10px; text-align:center; color: var(--ink-soft);
      border: 1px dashed var(--line); border-radius: 4px; font-size: 14px;
    }

    .stats-grid{
      display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
      gap: 14px; margin-bottom: 26px;
    }
    .stat{
      border-left: 3px solid var(--primary); padding: 4px 0 4px 12px;
    }
    .stat .num{ font-family:'Fraunces',serif; font-size: 30px; font-weight: 600; line-height:1; }
    .stat .label{ font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }

    .bilan-section h3{ font-size: 16px; margin: 26px 0 10px; }
    .quote-block{
      font-style: italic; color: var(--ink-soft); font-size: 13.5px;
      border-left: 2px solid var(--line); padding-left: 10px; margin: 6px 0;
    }

    .toast{
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 3px;
      font-size: 13.5px; opacity: 0; pointer-events:none; transition: opacity .25s;
      z-index: 50;
    }
    .toast.show{ opacity: 1; }

    .members-list{ display:flex; flex-direction:column; gap: 10px; }
    .member-row{
      display:flex; justify-content:space-between; align-items:center;
      padding: 10px 0; border-bottom: 1px solid var(--line);
    }
    .member-row .m-name{ font-weight:600; }
    .member-row .m-role{ font-size: 12.5px; color: var(--ink-soft); }
    .member-row .m-actions{ display:flex; gap:6px; }
    .member-row .m-actions button{ font-size:12px; padding:2px 8px; }

    .contact-fields-wrap{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:6px;
    }
    .contact-fields-wrap .contact-row{
      display:flex;
      gap:6px;
      align-items:center;
    }
    .contact-fields-wrap .contact-row input{
      flex:1;
    }
    .contact-fields-wrap .contact-row .remove-field{
      background:none;
      border:none;
      color:var(--danger);
      cursor:pointer;
      font-size:16px;
      line-height:1;
    }
    .add-contact-field{
      background:none;
      border:1px dashed var(--line);
      border-radius:3px;
      padding:4px 8px;
      cursor:pointer;
      font-size:12px;
      color:var(--ink-soft);
      margin-top:4px;
      width:fit-content;
    }
    .add-contact-field:hover{
      background:var(--line);
    }

    /* KANBAN */
    .kanban-board{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:16px;
      margin-top:10px;
    }
    .kanban-col{
      background:var(--bg-panel);
      border:1px solid var(--line);
      border-radius:4px;
      padding:10px;
      min-height:200px;
    }
    .kanban-col h3{
      font-size:15px;
      text-align:center;
      padding-bottom:8px;
      border-bottom:1px solid var(--line);
      margin-bottom:10px;
      color:var(--ink-soft);
    }
    .kanban-col .kanban-item{
      background:#fff;
      border:1px solid var(--line);
      border-radius:3px;
      padding:8px 10px;
      margin-bottom:6px;
      cursor:grab;
      font-size:13px;
      transition:box-shadow 0.2s;
    }
    .kanban-col .kanban-item:hover{
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
    }
    .kanban-col .kanban-item.dragging{
      opacity:0.4;
    }
    .kanban-col .kanban-item .k-title{
      font-weight:600;
    }
    .kanban-col .kanban-item .k-meta{
      font-size:11px;
      color:var(--ink-soft);
      margin-top:2px;
    }
    .kanban-col .kanban-empty{
      color:var(--ink-soft);
      font-style:italic;
      font-size:13px;
      text-align:center;
      padding:20px 0;
    }
    .kanban-col.drag-over{
      border-color:var(--primary);
      background:#f5f0f2;
    }

    /* PLANNING ANNUEL LUN-DIM */
    .planning-annual-wrapper{
      margin-top:10px;
    }
    .planning-annual-wrapper .week-nav{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:16px;
      flex-wrap:wrap;
    }
    .planning-annual-wrapper .week-nav .week-label{
      font-weight:600;
      font-size:16px;
      min-width:220px;
    }
    .planning-annual-grid{
      display:grid;
      grid-template-columns: 100px repeat(7, 1fr);
      gap:4px;
      background:var(--bg-panel);
      border:1px solid var(--line);
      padding:8px;
      border-radius:4px;
      overflow-x:auto;
    }
    .planning-annual-grid .cell{
      background:#fff;
      border:1px solid var(--line);
      border-radius:3px;
      padding:4px 6px;
      min-height:60px;
      font-size:12px;
    }
    .planning-annual-grid .cell-header{
      background:transparent;
      border:none;
      font-weight:600;
      color:var(--ink-soft);
      min-height:auto;
      padding:4px 2px;
      text-align:center;
    }
    .planning-annual-grid .cell .day-date{
      font-size:10px;
      color:var(--ink-soft);
      text-align:right;
      margin-bottom:2px;
    }
    .planning-annual-grid .cell .slot{
      background:#f0f0ea;
      border-radius:3px;
      padding:2px 4px;
      margin-bottom:3px;
      font-size:11px;
      cursor:default;
      display:flex;
      justify-content:space-between;
      align-items:center;
      line-height:1.3;
    }
    .planning-annual-grid .cell .slot .remove{
      color:var(--danger);
      font-weight:bold;
      margin-left:4px;
      cursor:pointer;
      font-size:11px;
    }
    .planning-annual-grid .cell .add-btn{
      background:none;
      border:1px dashed var(--line);
      border-radius:3px;
      color:var(--ink-soft);
      font-size:10px;
      padding:2px 4px;
      width:100%;
      cursor:pointer;
      margin-top:2px;
      text-align:center;
    }
    .planning-annual-grid .cell .add-btn:hover{
      background:var(--line);
    }
    .planning-annual-grid .week-number{
      font-weight:600;
      font-size:13px;
      color:var(--ink-soft);
      text-align:center;
      padding:4px 2px;
    }

    .planning-annual-grid .cell.weekend{
      background:#f9f7f2;
    }
    .planning-annual-grid .cell-header.weekend{
      background:transparent;
    }

    .planning-annual-grid .cell .slot .heure{
      font-size:9px;
      color:var(--ink-soft);
      margin-left:4px;
    }
    .planning-annual-grid .cell .slot.multi-day{
      background:#d4d4c8;
      border-left:3px solid var(--primary);
    }

    .sub-tabs{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      margin-bottom:16px;
      padding-bottom:4px;
      border-bottom:1px solid var(--line);
    }
    .sub-tabs .sub-tab{
      background:none;
      border:none;
      padding:6px 14px;
      border-radius:20px;
      cursor:pointer;
      font-family:'IBM Plex Sans', sans-serif;
      font-size:13.5px;
      color:var(--ink-soft);
      transition: all 0.2s;
      border:1px solid transparent;
    }
    .sub-tabs .sub-tab:hover{
      background:var(--bg-panel);
      border-color:var(--line);
    }
    .sub-tabs .sub-tab.active{
      background:var(--primary);
      color:#fff;
      border-color:var(--primary);
    }

    .member-tasks-section{
      margin-top:30px;
      padding-top:20px;
      border-top:2px solid var(--line);
    }
    .member-tasks-section h3{
      margin-bottom:12px;
    }
    .member-tasks-section .task-stats{
      display:flex;
      gap:16px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }
    .member-tasks-section .task-stats span{
      background:var(--bg-panel);
      padding:4px 12px;
      border-radius:12px;
      font-size:13px;
      border:1px solid var(--line);
    }
    .task-stat-a-faire{ border-left:3px solid var(--grey-status); }
    .task-stat-en-cours{ border-left:3px solid var(--ochre); }
    .task-stat-fait{ border-left:3px solid var(--teal); }
    .member-tasks-list .item{
      margin-bottom:6px;
      padding:8px 4px 8px 12px;
    }
    .member-tasks-list .item .title{
      font-size:14px;
    }
    .member-tasks-list .item .meta{
      font-size:11px;
    }

    .bilan-detailed{
      margin-top:30px;
      padding-top:20px;
      border-top:2px solid var(--line);
    }
    .bilan-detailed .bilan-stats{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
      gap:12px;
      margin-bottom:20px;
    }
    .bilan-detailed .bilan-stat{
      background:var(--bg-panel);
      padding:12px 16px;
      border-radius:4px;
      border-left:4px solid var(--primary);
    }
    .bilan-detailed .bilan-stat .num{
      font-family:'Fraunces',serif;
      font-size:28px;
      font-weight:600;
    }
    .bilan-detailed .bilan-stat .label{
      font-size:13px;
      color:var(--ink-soft);
    }
    .bilan-detailed table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
      margin-top:10px;
    }
    .bilan-detailed th{
      text-align:left;
      padding:6px 8px;
      border-bottom:2px solid var(--line);
      font-weight:600;
    }
    .bilan-detailed td{
      padding:6px 8px;
      border-bottom:1px solid var(--line);
    }

    @media (max-width: 800px){
      .planning-annual-grid{
        grid-template-columns: 60px repeat(7, 1fr);
        font-size:11px;
      }
      .planning-annual-grid .cell{
        min-height:50px;
        padding:3px 4px;
      }
      .planning-annual-grid .cell .slot{
        font-size:10px;
        padding:1px 3px;
      }
    }
    @media (max-width: 600px){
      .kanban-board{
        grid-template-columns: 1fr 1fr;
      }
      .planning-annual-grid{
        grid-template-columns: 40px repeat(7, 1fr);
        font-size:10px;
      }
      .planning-annual-grid .cell{
        min-height:40px;
        padding:2px 3px;
      }
      .planning-annual-grid .cell .slot{
        font-size:9px;
        padding:1px 2px;
      }
      .tabs-wrapper .tab-item{
        font-size:13px;
        padding:8px 4px 10px;
      }
    }
    @media (max-width: 500px){
      .kanban-board{
        grid-template-columns: 1fr;
      }
    }
      /* ---------- Ajouts : barre d'outils, indicateurs, composants ---------- */
    #app-error-banner{
      position: sticky; top: 0; z-index: 999;
      background: var(--danger); color: #fff;
      padding: 10px 14px; font-family: ui-monospace, monospace; font-size: 12.5px;
      white-space: pre-wrap; display: flex; gap: 10px; align-items: flex-start;
    }
    #app-error-banner .err-text{ flex: 1; }
    #app-error-banner .err-close{
      background: rgba(255,255,255,0.2); border: none; color: #fff;
      cursor: pointer; border-radius: 3px; padding: 2px 7px; font-size: 13px;
    }

    .masthead .mast-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

    .toolbar{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      margin-top: 10px;
    }
    .toolbar .btn.tiny{ padding: 4px 9px; font-size: 12px; }

    #save-indicator{
      font-size: 12px; color: var(--ink-soft);
      display:inline-flex; align-items:center; gap:6px;
      padding: 3px 9px; border-radius: 999px; border:1px solid var(--line);
      background: var(--bg-panel);
    }
    #save-indicator::before{
      content:''; width:7px; height:7px; border-radius:50%;
      background: var(--grey-status); flex-shrink:0;
    }
    #save-indicator.is-saved::before{ background: var(--teal); }
    #save-indicator.is-pending::before{ background: var(--ochre); }
    #save-indicator.is-error::before{ background: var(--danger); }
    #save-indicator.is-error{ color: var(--danger); border-color: var(--danger); font-weight:600; }

    #storage-note{
      background: #FBF3DE; border:1px solid var(--ochre); color: #6B4E12;
      padding: 8px 12px; border-radius: 4px; font-size: 12.5px; margin-top: 12px;
    }

    .section-sep{ border:none; border-top:1px solid var(--line); margin: 34px 0 24px; }

    .row-head .head-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

    .search-input{
      flex: 1; min-width: 180px;
      padding: 7px 10px; border:1px solid var(--line); border-radius:3px;
      font-family: inherit; font-size: 13.5px; background:#fff; color: var(--ink);
    }
    .search-input:focus{ outline:2px solid var(--primary); outline-offset:1px; }

    .pill{
      display:inline-block; min-width: 17px; padding: 0 5px;
      background: var(--line); color: var(--ink-soft);
      border-radius: 999px; font-size: 11px; font-weight:600;
      line-height: 17px; text-align:center; margin-left: 5px;
    }
    .sub-tab.active .pill{ background: var(--primary); color:#fff; }

    .sub-tabs-sep{
      display:inline-block; width:1px; align-self:stretch;
      background: var(--line); margin: 0 5px;
    }

    .req{ color: var(--danger); font-weight:700; }
    .hint{ font-size:12px; color: var(--ink-soft); }
    .warn{ color: var(--danger); font-weight:600; }
    .item.is-late{ background: #FDF6F6; }
    .item .desc.note{ font-style: italic; }
    .item .ville{ font-weight: 400; color: var(--ink-soft); }
    .meta.spread{ gap: 18px; }

    .field-legend{ font-weight:600; display:block; margin-bottom:6px; }
    .checkbox-row{ display:flex; flex-wrap:wrap; gap:10px 16px; }
    .checkbox-row .cb{
      display:flex; align-items:center; gap:6px;
      font-weight:normal; font-size:13.5px; cursor:pointer;
    }
    .inline-label{ display:flex; align-items:center; gap:6px; font-size:13.5px; }

    .contacts .contact-line{ margin-bottom: 2px; }
    .contacts .c-label{ font-weight:600; color: var(--ink); }

    .count-tag.spaced{ display:block; margin-bottom:10px; }

    /* Projets */
    .projet-head{
      display:flex; justify-content:space-between; align-items:center;
      gap:16px; flex-wrap:wrap; margin-bottom:16px;
    }
    .projet-actions{ display:flex; gap:6px; }
    .progress-wrap{ display:flex; align-items:center; gap:10px; min-width:220px; flex:1; max-width:360px; }
    .progress-bar{
      flex:1; height:8px; background: var(--line);
      border-radius:999px; overflow:hidden;
    }
    .progress-fill{ height:100%; background: var(--teal); transition: width .3s ease; }
    .progress-label{ font-size:12px; color: var(--ink-soft); white-space:nowrap; }

    .stats-grid.compact .stat{ padding: 12px 14px; }
    .stats-grid.compact .stat .num{ font-size: 24px; }

    /* Planning */
    .planning-annual-grid .cell.is-today{ background: #FFF9E8; }
    .planning-annual-grid .cell.is-today .day-date{ color: var(--primary); font-weight:700; }
    .planning-annual-grid .cell .slot{ cursor:pointer; }
    .week-nav .year-tag{ font-size:13px; color: var(--ink-soft); margin-left:6px; }

    /* Kanban */
    .kanban-col h3{ display:flex; align-items:center; justify-content:space-between; }
    .kanban-item .k-move{
      width:100%; margin-top:6px; font-size:11.5px; padding:3px 4px;
      border:1px solid var(--line); border-radius:3px;
      background: var(--bg-panel); color: var(--ink-soft); font-family: inherit;
    }

    /* Bilan */
    .repartition{ display:flex; flex-direction:column; gap:6px; max-width:520px; }
    .rep-row{ display:flex; align-items:center; gap:10px; font-size:13.5px; }
    .rep-label{ min-width:110px; }
    .rep-bar{ flex:1; height:9px; background: var(--line); border-radius:999px; overflow:hidden; }
    .rep-fill{ display:block; height:100%; background: var(--primary); }
    .rep-num{ min-width:24px; text-align:right; font-weight:600; }
    .repartition-cols{ display:flex; gap:34px; flex-wrap:wrap; margin: 18px 0; }
    .repartition-cols h4{ font-family:'Fraunces',serif; font-size:14px; margin:0 0 6px; }
    .bilan-result h4{ font-family:'Fraunces',serif; font-size:16px; margin: 18px 0 12px; }
    .table-wrap{ overflow-x:auto; margin-top: 14px; }

    /* Membres */
    .member-row.is-selected{
      background: var(--bg-panel);
      border-left:3px solid var(--primary);
      padding-left: 10px;
    }
    .member-row .m-actions{ align-items:center; flex-wrap:wrap; }
    .member-tasks-head{ margin-bottom:8px; }

    @media (max-width: 640px){
      .masthead{ flex-direction:column; align-items:flex-start; }
      .row-head{ flex-direction:column; align-items:flex-start; gap:10px; }
      .projet-head{ flex-direction:column; align-items:stretch; }
      .progress-wrap{ max-width:none; }
      .repartition-cols{ gap:18px; }
    }

  </style>
</head>

/* ---------- Bandeau d'erreur ---------- */
function showErrorBanner(msg){
  let banner = document.getElementById('app-error-banner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'app-error-banner';
    banner.setAttribute('role', 'alert');
    banner.innerHTML = '<span class="err-text"></span><button type="button" class="err-close" aria-label="Masquer">✕</button>';
    document.body.insertBefore(banner, document.body.firstChild);
    banner.querySelector('.err-close').addEventListener('click', ()=> banner.remove());
  }
  banner.querySelector('.err-text').textContent = 'Erreur : ' + msg;
}

window.addEventListener('error', function(e){
  const msg = (e.error && e.error.stack) ? e.error.stack : (e.message || 'erreur inconnue');
  showErrorBanner(msg + (e.filename ? (' (' + e.filename + ':' + e.lineno + ':' + e.colno + ')') : ''));
});
window.addEventListener('unhandledrejection', function(e){
  const reason = e.reason;
  showErrorBanner('promesse rejetée : ' + ((reason && reason.stack) ? reason.stack : String(reason)));
});

function cryptoId(){
  if(window.crypto && window.crypto.randomUUID) return 'id-' + window.crypto.randomUUID().slice(0, 12);

}

function slugify(str){
  return String(str).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function esc(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toLocalDateStr(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function formatDate(iso){
  if(!iso) return '';
  const parts = String(iso).split('-');
  if(parts.length !== 3) return iso;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

function getWeekNumber(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

/** Durée "2:00" ou "2h30" ou "90" (minutes) -> minutes */
function dureeEnMinutes(str){
  if(!str) return 0;
  const s = String(str).trim().replace(',', '.');
  let m = s.match(/^(\d+)\s*[:hH]\s*(\d+)?$/);
  if(m) return parseInt(m[1],10)*60 + (parseInt(m[2],10) || 0);
  m = s.match(/^(\d+(?:\.\d+)?)\s*h$/i);
  if(m) return Math.round(parseFloat(m[1])*60);
  m = s.match(/^(\d+)$/);
  if(m) return parseInt(m[1],10);
  return 0;
}

function formatMinutes(total){
  const h = Math.floor(total/60);
  const m = total % 60;
  if(h && m) return `${h}h${String(m).padStart(2,'0')}`;
  if(h) return `${h}h`;
  return `${m}min`;
}

/* ==========================================================
   PERSISTANCE
   Trois niveaux : stockage cloud de l'artefact -> localStorage -> mémoire.
   ========================================================== */
const HAS_CLOUD_STORAGE = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
let STORAGE_MODE = HAS_CLOUD_STORAGE ? 'cloud' : 'local';
let storageHealthy = true;

const SEED = {
  membres: [
    { id: cryptoId(), prenom:"Edith",   nom:"Chateau",  role:"Responsable artistique, chorégraphe" },
    { id: cryptoId(), prenom:"Mary",    nom:"Fouillet", role:"Administratrice de production" },
    { id: cryptoId(), prenom:"Alexa",   nom:"Althiery", role:"Chorégraphe, interprète" },
    { id: cryptoId(), prenom:"Aurélie", nom:"Fontaine", role:"Chargée de production" }
  ],
  salles: [],
  activites: [],
  taches: [],
  projets: [...DEFAULT_PROJECTS],
  tabs: DEFAULT_TABS.map(t => ({ ...t })),
  meta: { seedSallesImportees: false, sallesSupprimees: [], version: 2 }
};

function emptyState(){
  return JSON.parse(JSON.stringify(SEED));
}

async function loadState(){
  let raw = null;
  try{
    if(HAS_CLOUD_STORAGE){
      const r = await window.storage.get(STORAGE_KEY, SHARED);
      raw = r && r.value ? r.value : null;
    }
  }catch(e){
    // Clé absente au premier lancement : ce n'est pas une anomalie.
    raw = null;
  }

  if(raw === null){
    try{
      raw = window.localStorage ? window.localStorage.getItem(STORAGE_KEY) : null;
      if(raw && HAS_CLOUD_STORAGE) STORAGE_MODE = 'cloud';
    }catch(e){ raw = null; }
  }

  if(raw){
    try{
      const parsed = JSON.parse(raw);
      STATE = Object.assign(emptyState(), parsed);
    }catch(e){
      showErrorBanner("Sauvegarde illisible, données par défaut chargées. L'ancienne sauvegarde n'a pas été écrasée.");
      STATE = emptyState();
    }
  } else {
    STATE = emptyState();
  }

  migrate();
  loaded = true;
}

/** Migrations et normalisation — idempotent. */
function migrate(){
  STATE.meta = STATE.meta || {};
  if(!Array.isArray(STATE.meta.sallesSupprimees)) STATE.meta.sallesSupprimees = [];

  ['taches','salles','activites','membres','projets','tabs'].forEach(k=>{
    if(!Array.isArray(STATE[k])) STATE[k] = [];
  });

  // Projets : récupère l'ancienne liste codée en dur au premier chargement.
  if(STATE.projets.length === 0) STATE.projets = [...DEFAULT_PROJECTS];

  // Membres : identifiants stables.
  STATE.membres.forEach(m => { if(!m.id) m.id = cryptoId(); });

  // Salles : anciens champs de contact -> contactFields.
  STATE.salles.forEach(s=>{
    if(!s.id) s.id = cryptoId();
    if(s.contactFields === undefined){
      const fields = [];
      ['contactDirecteur','contactProduction','contactAdministration','contactCommunication','contactTechnique'].forEach(k=>{
        if(s[k]){ fields.push({ label: k.replace('contact',''), value: s[k] }); delete s[k]; }
      });
      s.contactFields = fields;
    }
    if(!Array.isArray(s.contactFields)) s.contactFields = [];
    if(!s.categorie) s.categorie = 'reunion';
    if(s.statut === undefined) s.statut = '';
    if(!Array.isArray(s.projets)) s.projets = [];
  });

  // Tâches : identifiants et champs manquants.
  STATE.taches.forEach(t=>{
    if(!t.id) t.id = cryptoId();
    if(t.statut === undefined) t.statut = 'À faire';
    if(t.priorite === undefined) t.priorite = 'Moyenne';
    ['description','commentaire','dateLimite','responsable','projet'].forEach(k=>{
      if(t[k] === undefined) t[k] = '';
    });
  });

  // Activités : champs ajoutés au fil des versions.
  STATE.activites.forEach(a=>{
    if(!a.id) a.id = cryptoId();
    ['heureDebut','heureFin','dateFin','lieuCustom','partenaires','fonctionne','difficultes','notes','duree','responsable'].forEach(k=>{
      if(a[k] === undefined) a[k] = '';
    });
    if(a.lieuType === undefined) a.lieuType = 'autre';
    if(a.statut === undefined) a.statut = 'Prévue';
    if(!a.annee && a.date) a.annee = String(a.date).slice(0,4);
  });

  // Import unique des salles pré-remplies. Une salle supprimée reste supprimée.
  importSeedSallesUneFois();

  // Onglets : complète les onglets natifs manquants sans détruire les onglets personnalisés.
  if(STATE.tabs.length === 0){
    STATE.tabs = DEFAULT_TABS.map(t => ({ ...t }));
  } else {
    STATE.tabs = STATE.tabs.filter(t => t && t.id && !String(t.id).startsWith('projet-') &&
      !['salles-reunion','salles-metropole','etablissements-scolaires'].includes(t.id));
    DEFAULT_TABS.forEach(def=>{
      if(!STATE.tabs.some(t => t.id === def.id)) STATE.tabs.push({ ...def });
    });
  }
  // Les deux premiers onglets restent non supprimables.
  STATE.tabs.forEach(t=>{
    const def = DEFAULT_TABS.find(d => d.id === t.id);
    if(def) t.removable = def.removable;
    else if(t.removable === undefined) t.removable = true;
  });
}

function importSeedSallesUneFois(){
  const supprimees = new Set(STATE.meta.sallesSupprimees);
  const cle = (nom, cat) => cat + '::' + nom;
  let ajoutees = 0;

  const ajouter = (seedList, categorie) => {
    if(typeof seedList === 'undefined') return;
    seedList.forEach(seed=>{
      const k = cle(seed.nom, categorie);
      if(supprimees.has(k)) return;
      const existe = STATE.salles.some(s => s.nom === seed.nom && s.categorie === categorie);
      if(existe) return;
      STATE.salles.push({
        id: cryptoId(), nom: seed.nom, ville: seed.ville || '',
        contactFields: (seed.contactFields || []).map(f => ({ ...f })),
        statut: '', prochaineAction: '', dateRelance: '', responsable: '',
        categorie, projets: [], seed: true
      });
      ajoutees++;
    });
  };

  if(!STATE.meta.seedSallesImportees){
    ajouter(typeof SEED_SALLES_REUNION   !== 'undefined' ? SEED_SALLES_REUNION   : [], 'reunion');
    ajouter(typeof SEED_SALLES_METROPOLE !== 'undefined' ? SEED_SALLES_METROPOLE : [], 'metropole');
    STATE.meta.seedSallesImportees = true;
    if(ajoutees) scheduleSave();
  }
}

/* ---------- Écriture ---------- */
let saveTimer = null;
let savePending = false;

/** Sauvegarde différée : regroupe les écritures rapprochées. */
function scheduleSave(){
  savePending = true;
  updateSaveIndicator('pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=> { saveState(); }, 400);
}

async function saveState(){
  clearTimeout(saveTimer);
  const payload = JSON.stringify(STATE);
  let ok = false;

  if(HAS_CLOUD_STORAGE){
    try{
      await window.storage.set(STORAGE_KEY, payload, SHARED);
      ok = true;
    }catch(e){
      ok = false;
    }
  }

  // Copie locale systématique : filet de sécurité si le stockage cloud échoue.
  try{
    if(window.localStorage){
      window.localStorage.setItem(STORAGE_KEY, payload);
      ok = true;
    }
  }catch(e){ /* quota dépassé ou stockage bloqué */ }

  savePending = false;
  storageHealthy = ok;
  if(ok){
    STATE.meta.derniereSauvegarde = new Date().toISOString();
    updateSaveIndicator('saved');
  } else {
    updateSaveIndicator('error');
    showToast("Sauvegarde impossible — exportez vos données par sécurité");
  }
  return ok;
}

function updateSaveIndicator(status){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  el.classList.remove('is-pending','is-saved','is-error');
  if(status === 'pending'){
    el.classList.add('is-pending');
    el.textContent = 'Enregistrement…';
  } else if(status === 'saved'){
    el.classList.add('is-saved');
    const mode = HAS_CLOUD_STORAGE ? 'partagé' : 'ce navigateur';
    el.textContent = `Enregistré (${mode}) · ${new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}`;
  } else {
    el.classList.add('is-error');
    el.textContent = 'Non enregistré !';
  }
}

// Dernier filet : sauvegarde synchrone avant fermeture de l'onglet.
window.addEventListener('beforeunload', function(){
  if(savePending){
    try{
      if(window.localStorage) window.localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    }catch(e){}
  }
});

/* ---------- Export / import ---------- */
function exporterDonnees(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cie3-sauvegarde-${toLocalDateStr(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('Sauvegarde téléchargée');
}

function importerDonnees(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(typeof parsed !== 'object' || parsed === null) throw new Error('format invalide');
      if(!confirmAction("Remplacer toutes les données actuelles par le contenu de ce fichier ?")) return;
      STATE = Object.assign(emptyState(), parsed);
      migrate();
      await saveState();
      showToast('Données importées');
      rebuildPanels();
      renderTabs();
      renderPanelContent(activeTabId);
    }catch(e){
      showToast('Fichier illisible — import annulé');
    }
  };
  reader.readAsText(file);
}

/* ==========================================================
   DÉLÉGATION D'ÉVÉNEMENTS
   Un seul écouteur pour toute l'application. Les éléments déclarent
   leur intention via data-action, ce qui survit à n'importe quel
   re-rendu : plus de gestionnaires perdus quand le DOM est remplacé.
   ========================================================== */
const actions = Object.create(null);

function registerAction(name, handler){ actions[name] = handler; }

function handleDelegated(e, type){
  const el = e.target.closest(`[data-action][data-on="${type}"], [data-action]:not([data-on])`);
  if(!el) return;
  const name = el.dataset.action;
  const handler = actions[name];
  if(!handler) return;
  const expected = el.dataset.on || 'click';
  if(expected !== type) return;
  e.preventDefault();
  e.stopPropagation();
  try{
    handler(el, e);
  }catch(err){
    showErrorBanner((err && err.stack) ? err.stack : String(err));
  }
}

document.addEventListener('click',  e => handleDelegated(e, 'click'));
document.addEventListener('change', e => handleDelegated(e, 'change'));
document.addEventListener('input',  e => handleDelegated(e, 'input'));

// Raccourci clavier : Ctrl/Cmd + S force une sauvegarde immédiate.
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    saveState().then(ok => { if(ok) showToast('Enregistré'); });
  }
});

/* ---------- Helpers de rendu ---------- */
/** Remplace le contenu d'un élément. Les actions étant déléguées,
 *  aucun gestionnaire n'est perdu. */
function mount(el, html){
  if(!el) return null;
  el.innerHTML = html;
  return el;
}

function byId(id){ return document.getElementById(id); }

function panelIsActive(id){
  const p = byId(id);
  return !!(p && p.classList.contains('active'));
}

/* ==========================================================
   ONGLETS
   ========================================================== */
let activeTabId = 'taches';

function renderTabs(){
  const container = byId('tabsContainer');
  if(!container) return;

  let html = '';
  STATE.tabs.forEach(tab => {
    const active = tab.id === activeTabId;
    html += `<button type="button" class="tab-item ${active ? 'active' : ''}"
      role="tab" aria-selected="${active}" aria-controls="${esc(tab.id)}"
      data-action="switch-tab" data-tabid="${esc(tab.id)}">
      ${esc(tab.label)}
      <span class="tab-actions">
        <span role="button" tabindex="0" class="rename-tab" title="Renommer l'onglet"
              data-action="rename-tab" data-tabid="${esc(tab.id)}">✎</span>
        ${tab.removable !== false
          ? `<span role="button" tabindex="0" class="del-tab" title="Supprimer l'onglet"
                   data-action="delete-tab" data-tabid="${esc(tab.id)}">✕</span>`
          : ''}
      </span>
    </button>`;
  });

  html += `<button type="button" class="add-tab-btn" title="Ajouter un onglet vide" data-action="add-tab">+</button>`;
  mount(container, html);
}

registerAction('switch-tab', el => switchTab(el.dataset.tabid));

registerAction('rename-tab', el => {
  const tab = STATE.tabs.find(t => t.id === el.dataset.tabid);
  if(!tab) return;
  const newLabel = prompt("Nouveau nom de l'onglet :", tab.label);
  if(newLabel && newLabel.trim()){
    tab.label = newLabel.trim();
    scheduleSave();
    renderTabs();
  }
});

registerAction('delete-tab', el => {
  const tabId = el.dataset.tabid;
  const tab = STATE.tabs.find(t => t.id === tabId);
  if(!tab) return;
  if(tab.removable === false){ showToast("Cet onglet ne peut pas être supprimé"); return; }
  if(!confirmAction(`Supprimer l'onglet « ${tab.label} » ?\nLes données (tâches, lieux, activités) sont conservées.`)) return;

  const panelEl = byId(tabId);
  if(panelEl) panelEl.remove();
  STATE.tabs = STATE.tabs.filter(t => t.id !== tabId);
  scheduleSave();
  if(activeTabId === tabId && STATE.tabs.length) activeTabId = STATE.tabs[0].id;
  renderTabs();
  switchTab(activeTabId);
});

registerAction('add-tab', () => {
  const label = prompt("Nom du nouvel onglet :");
  if(!label || !label.trim()) return;
  const id = 'tab-' + cryptoId();
  STATE.tabs.push({ id, label: label.trim(), removable: true, custom: true });
  scheduleSave();
  ensurePanel(id);
  renderTabs();
  switchTab(id);
});

function ensurePanel(id){
  let panel = byId(id);
  if(!panel){
    panel = document.createElement('div');
    panel.id = id;
    panel.className = 'panel';
    panel.setAttribute('role', 'tabpanel');
    byId('panelContainer').appendChild(panel);
  }
  return panel;
}

function rebuildPanels(){
  const container = byId('panelContainer');
  if(!container) return;
  container.innerHTML = '';
  STATE.tabs.forEach(tab => ensurePanel(tab.id));
  if(!STATE.tabs.some(t => t.id === activeTabId) && STATE.tabs.length){
    activeTabId = STATE.tabs[0].id;
  }
  const active = byId(activeTabId);
  if(active) active.classList.add('active');
}

function switchTab(tabId){
  if(!tabId) return;
  activeTabId = tabId;
  document.querySelectorAll('.tab-item').forEach(b => {
    const on = b.dataset.tabid === tabId;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', String(on));
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const panel = ensurePanel(tabId);
  panel.classList.add('active');
  renderPanelContent(tabId);

  // Mémorise l'onglet courant pour le retrouver à la prochaine ouverture.
  if(loaded && STATE.meta && STATE.meta.dernierOnglet !== tabId){
    STATE.meta.dernierOnglet = tabId;
    scheduleSave();
  }
}

function renderPanelContent(tabId){
  switch(tabId){
    case 'taches':        return renderTachesAccueil();
    case 'projets':       return renderProjets();
    case 'lieux':         return renderLieux();
    case 'kanban-salles': return renderKanbanSalles();
    case 'activites':     return renderActivites();
    case 'bilan':         return renderBilan();
    case 'membres':       return renderMembres();
    default: {
      const panel = byId(tabId);
      const tab = STATE.tabs.find(t => t.id === tabId);
      if(panel && !panel.innerHTML.trim()){
        mount(panel, `
          <div class="row-head"><h2>${esc(tab ? tab.label : 'Nouvel onglet')}</h2></div>
          <div class="empty">Cet onglet est vide. Utilisez-le comme bloc-notes libre.</div>
          <div class="form-card">
            <label class="full">Notes
              <textarea id="notes-${esc(tabId)}" rows="10" placeholder="Notes libres…"
                data-action="save-tab-notes" data-on="input" data-tabid="${esc(tabId)}">${esc(tab && tab.notes ? tab.notes : '')}</textarea>
            </label>
          </div>
        `);
      }
    }
  }
}

registerAction('save-tab-notes', el => {
  const tab = STATE.tabs.find(t => t.id === el.dataset.tabid);
  if(!tab) return;
  tab.notes = el.value;
  scheduleSave();
});

/* ==========================================================
   TÂCHES
   Un même moteur sert l'accueil (toutes les tâches) et la vue par projet.
   ========================================================== */
const tacheUI = {
  statut: 'Toutes',
  projet: 'Tous',
  membre: 'Tous',
  recherche: '',
  // Formulaire ouvert : null, 'new', ou l'identifiant de la tâche en cours d'édition.
  formOuvert: null,
  // Contexte du formulaire, pour re-rendre le bon panneau.
  formPanel: null
};

function renderTachesAccueil(){
  const el = byId('taches');
  if(!el) return;

  mount(el, `
    <div id="taches-content"></div>
    <hr class="section-sep">
    <div id="planning-embed"></div>
  `);

  renderTachesScope(null, byId('taches-content'), 'taches');
  renderPlanningAnnual(byId('planning-embed'));
}

function renderTachesScope(scope, el, panelId){
  if(!el) return;

  const recherche = tacheUI.recherche.toLowerCase().trim();
  const projets = allProjects();

  let filtered = STATE.taches.filter(t => {
    if(scope !== null && t.projet !== scope) return false;
    if(scope === null && tacheUI.projet !== 'Tous' && t.projet !== tacheUI.projet) return false;
    if(tacheUI.membre !== 'Tous' && t.responsable !== tacheUI.membre) return false;
    if(tacheUI.statut !== 'Toutes' && t.statut !== tacheUI.statut) return false;
    if(recherche){
      const foin = [t.tache, t.description, t.commentaire, t.projet, t.responsable]
        .filter(Boolean).join(' ').toLowerCase();
      if(!foin.includes(recherche)) return false;
    }
    return true;
  });

  // Tri : non terminées d'abord, puis par échéance croissante.
  const rangStatut = s => (s === 'Fait' ? 1 : 0);
  filtered.sort((a,b)=>{
    const r = rangStatut(a.statut) - rangStatut(b.statut);
    if(r !== 0) return r;
    return (a.dateLimite || '9999-99-99').localeCompare(b.dateLimite || '9999-99-99');
  });

  const total = scope === null ? STATE.taches.length : STATE.taches.filter(t => t.projet === scope).length;
  const enRetard = filtered.filter(t => estEnRetard(t)).length;

  const projetOptions = ['Tous', ...projets]
    .map(p => `<option value="${esc(p)}" ${tacheUI.projet===p?'selected':''}>${esc(p)}</option>`).join('');
  const membreOpts = ['Tous', ...STATE.membres.map(memberName)]
    .map(m => `<option value="${esc(m)}" ${tacheUI.membre===m?'selected':''}>${esc(m)}</option>`).join('');
  const statutOpts = ['Toutes','À faire','En cours','Fait']
    .map(s => `<option value="${esc(s)}" ${tacheUI.statut===s?'selected':''}>${s}</option>`).join('');

  mount(el, `
    <div class="row-head">
      <h2>${scope === null ? 'Tâches' : esc(scope)}</h2>
      <div class="head-right">
        <span class="count-tag">${filtered.length} / ${total} affichée(s)${enRetard ? ` · <span class="warn">${enRetard} en retard</span>` : ''}</span>
        <button type="button" class="btn" data-action="tache-new" data-scope="${esc(scope || '')}" data-panel="${esc(panelId)}">+ Nouvelle tâche</button>
      </div>
    </div>

    <div class="filters">
      <input type="search" class="search-input" placeholder="Rechercher une tâche…"
             value="${esc(tacheUI.recherche)}" aria-label="Rechercher une tâche"
             data-action="tache-filter-search" data-on="input"
             data-scope="${esc(scope || '')}" data-panel="${esc(panelId)}">
      <select aria-label="Filtrer par statut" data-action="tache-filter-statut" data-on="change"
              data-scope="${esc(scope || '')}" data-panel="${esc(panelId)}">${statutOpts}</select>
      ${scope === null ? `
      <select aria-label="Filtrer par projet" data-action="tache-filter-projet" data-on="change"
              data-scope="" data-panel="${esc(panelId)}">${projetOptions}</select>` : ''}
      <select aria-label="Filtrer par responsable" data-action="tache-filter-membre" data-on="change"
              data-scope="${esc(scope || '')}" data-panel="${esc(panelId)}">${membreOpts}</select>
      ${(tacheUI.statut!=='Toutes'||tacheUI.projet!=='Tous'||tacheUI.membre!=='Tous'||tacheUI.recherche)
        ? `<button type="button" class="btn small secondary" data-action="tache-filter-reset"
             data-scope="${esc(scope || '')}" data-panel="${esc(panelId)}">Réinitialiser</button>` : ''}
    </div>

    <div id="tache-form-slot-${esc(panelId)}"></div>

    <div class="list" id="tache-list-${esc(panelId)}">
      ${filtered.length
        ? filtered.map(t => tacheItemHtml(t, scope, panelId)).join('')
        : `<div class="empty">${total === 0 ? "Aucune tâche pour l'instant. Créez-en une avec « + Nouvelle tâche »." : "Aucune tâche ne correspond à ces filtres."}</div>`}
    </div>
  `);

  // Réaffiche le formulaire s'il était ouvert dans ce panneau.
  if(tacheUI.formOuvert && tacheUI.formPanel === panelId){
    const existing = tacheUI.formOuvert === 'new'
      ? null
      : STATE.taches.find(t => t.id === tacheUI.formOuvert);
    if(tacheUI.formOuvert === 'new' || existing){
      openTacheForm(existing, scope, panelId, true);
    } else {
      tacheUI.formOuvert = null;
    }
  }
}

function estEnRetard(t){
  if(!t.dateLimite || t.statut === 'Fait') return false;
  return t.dateLimite < toLocalDateStr(new Date());
}

function tacheItemHtml(t, scope, panelId){
  const retard = estEnRetard(t);
  const scopeAttr = `data-id="${esc(t.id)}" data-scope="${esc(scope || '')}" data-panel="${esc(panelId)}"`;
  return `
    <div class="item ${statusClass('tache', t.statut)} ${retard ? 'is-late' : ''}">
      <div class="main">
        <div class="title">${esc(t.tache)}</div>
        <div class="meta">
          ${t.dateLimite ? `<span class="${retard ? 'warn' : ''}">Échéance : ${formatDate(t.dateLimite)}${retard ? ' ⚠' : ''}</span>` : ''}
          ${t.responsable ? `<span>Responsable : ${esc(t.responsable)}</span>` : ''}
          ${t.projet ? `<span>Projet : ${esc(t.projet)}</span>` : ''}
          ${t.priorite ? `<span>Priorité : ${esc(t.priorite)}</span>` : ''}
          <span class="status-label">${esc(t.statut)}</span>
        </div>
        ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ''}
        ${t.commentaire ? `<div class="desc note">💬 ${esc(t.commentaire)}</div>` : ''}
      </div>
      <div class="actions">
        <button type="button" class="btn small secondary" data-action="tache-toggle" ${scopeAttr}>${t.statut==='Fait' ? 'Rouvrir' : 'Marquer fait'}</button>
        <button type="button" class="btn small secondary" data-action="tache-edit" ${scopeAttr}>Modifier</button>
        <button type="button" class="btn small danger" data-action="tache-delete" ${scopeAttr}>Suppr.</button>
      </div>
    </div>
  `;
}

/* ---------- Formulaire ---------- */
function openTacheForm(existing, scope, panelId, dejaOuvert){
  const slot = byId('tache-form-slot-' + panelId);
  if(!slot) return;

  if(!dejaOuvert){
    tacheUI.formOuvert = existing ? existing.id : 'new';
    tacheUI.formPanel = panelId;
  }

  const t = existing || {
    tache:'', description:'', commentaire:'', dateLimite:'',
    responsable:'', priorite:'Moyenne', statut:'À faire',
    projet: scope || ''
  };

  const projectOptions = ['', ...allProjects()].map(p => {
    const label = p || '— Aucun —';
    return `<option value="${esc(p)}" ${(t.projet || '') === p ? 'selected' : ''}>${esc(label)}</option>`;
  }).join('');

  mount(slot, `
    <div class="form-card">
      <h3>${existing ? 'Modifier la tâche' : 'Nouvelle tâche'}</h3>
      <div class="form-grid">
        <label class="full">Tâche <span class="req">*</span>
          <input type="text" id="f-tache" value="${esc(t.tache)}" placeholder="Ex : Réserver la salle" required>
        </label>
        <label class="full">Description
          <textarea id="f-description" rows="2" placeholder="Détails">${esc(t.description)}</textarea>
        </label>
        <label class="full">Commentaire
          <textarea id="f-commentaire" rows="2" placeholder="Suivi, échanges, précisions…">${esc(t.commentaire)}</textarea>
        </label>
        <label>Date limite
          <input type="date" id="f-date-limite" value="${esc(t.dateLimite)}">
        </label>
        <label>Responsable
          <select id="f-responsable">${membreOptions(t.responsable)}</select>
        </label>
        <label>Projet
          <select id="f-projet">${projectOptions}</select>
        </label>
        <label>Priorité
          <select id="f-priorite">
            ${['Basse','Moyenne','Haute'].map(p=>`<option ${t.priorite===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </label>
        <label>Statut
          <select id="f-statut">
            ${['À faire','En cours','Fait'].map(s=>`<option ${t.statut===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-action="tache-save"
          data-id="${esc(existing ? existing.id : '')}" data-scope="${esc(scope || '')}" data-panel="${esc(panelId)}">Enregistrer</button>
        <button type="button" class="btn secondary" data-action="tache-cancel"
          data-scope="${esc(scope || '')}" data-panel="${esc(panelId)}">Annuler</button>
      </div>
    </div>
  `);

  const first = slot.querySelector('#f-tache');
  if(first && !dejaOuvert) first.focus();
}

/** Re-rend le panneau de tâches concerné, et rafraîchit les vues liées. */
function refreshTaches(scope, panelId){
  if(panelId === 'taches'){
    const c = byId('taches-content');
    if(c) renderTachesScope(null, c, 'taches');
  } else {
    const c = byId('projet-taches-content');
    if(c) renderTachesScope(scope || null, c, panelId);
  }
  if(panelIsActive('membres')) renderMembres();
}

/* ---------- Actions ---------- */
function ctx(el){
  return { scope: el.dataset.scope || null, panel: el.dataset.panel || 'taches' };
}

registerAction('tache-new', el => {
  const { scope, panel } = ctx(el);
  openTacheForm(null, scope, panel);
});

registerAction('tache-edit', el => {
  const { scope, panel } = ctx(el);
  const t = STATE.taches.find(x => x.id === el.dataset.id);
  if(t) openTacheForm(t, scope, panel);
});

registerAction('tache-cancel', el => {
  const { scope, panel } = ctx(el);
  tacheUI.formOuvert = null;
  tacheUI.formPanel = null;
  const slot = byId('tache-form-slot-' + panel);
  if(slot) slot.innerHTML = '';
  refreshTaches(scope, panel);
});

registerAction('tache-save', el => {
  const { scope, panel } = ctx(el);
  const val = {
    tache:       byId('f-tache').value.trim(),
    description: byId('f-description').value.trim(),
    commentaire: byId('f-commentaire').value.trim(),
    dateLimite:  byId('f-date-limite').value,
    responsable: byId('f-responsable').value,
    projet:      byId('f-projet').value,
    priorite:    byId('f-priorite').value,
    statut:      byId('f-statut').value
  };
  if(!val.tache){ showToast("Donnez un nom à la tâche"); byId('f-tache').focus(); return; }

  const existing = el.dataset.id ? STATE.taches.find(x => x.id === el.dataset.id) : null;
  if(existing){
    Object.assign(existing, val);
  } else {
    val.id = cryptoId();
    val.creeLe = new Date().toISOString();
    STATE.taches.push(val);
  }

  scheduleSave();
  tacheUI.formOuvert = null;
  tacheUI.formPanel = null;
  showToast(existing ? "Tâche modifiée" : "Tâche créée");
  refreshTaches(scope, panel);
});

registerAction('tache-delete', el => {
  const { scope, panel } = ctx(el);
  const t = STATE.taches.find(x => x.id === el.dataset.id);
  if(!t) return;
  if(!confirmAction(`Supprimer la tâche « ${t.tache} » ?`)) return;
  STATE.taches = STATE.taches.filter(x => x.id !== el.dataset.id);
  if(tacheUI.formOuvert === el.dataset.id) tacheUI.formOuvert = null;
  scheduleSave();
  showToast("Tâche supprimée");
  refreshTaches(scope, panel);
});

registerAction('tache-toggle', el => {
  const { scope, panel } = ctx(el);
  const t = STATE.taches.find(x => x.id === el.dataset.id);
  if(!t) return;
  t.statut = (t.statut === 'Fait') ? 'À faire' : 'Fait';
  scheduleSave();
  refreshTaches(scope, panel);
});

registerAction('tache-filter-statut', el => {
  tacheUI.statut = el.value;
  const { scope, panel } = ctx(el);
  refreshTaches(scope, panel);
});

registerAction('tache-filter-projet', el => {
  tacheUI.projet = el.value;
  const { scope, panel } = ctx(el);
  refreshTaches(scope, panel);
});

registerAction('tache-filter-membre', el => {
  tacheUI.membre = el.value;
  const { scope, panel } = ctx(el);
  refreshTaches(scope, panel);
});

registerAction('tache-filter-reset', el => {
  tacheUI.statut = 'Toutes';
  tacheUI.projet = 'Tous';
  tacheUI.membre = 'Tous';
  tacheUI.recherche = '';
  const { scope, panel } = ctx(el);
  refreshTaches(scope, panel);
});

// La recherche re-rend la liste uniquement, pour ne pas voler le focus au champ.
registerAction('tache-filter-search', el => {
  tacheUI.recherche = el.value;
  const { scope, panel } = ctx(el);
  const pos = el.selectionStart;
  refreshTaches(scope, panel);
  const nouveau = document.querySelector(`[data-action="tache-filter-search"][data-panel="${panel}"]`);
  if(nouveau){
    nouveau.focus();
    try{ nouveau.setSelectionRange(pos, pos); }catch(e){}
  }
});

/* ==========================================================
   PLANNING HEBDOMADAIRE
   ========================================================== */
let planningWeekOffset = 0;

const JOURS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

function lundiDeLaSemaine(offset){
  const today = new Date();
  const jour = today.getDay();                 // 0 = dimanche
  const decalage = (jour === 0) ? -6 : 1 - jour;
  const monday = new Date(today);
  monday.setDate(today.getDate() + decalage + (offset * 7));
  monday.setHours(0,0,0,0);
  return monday;
}

function renderPlanningAnnual(container){
  if(!container) return;

  const baseMonday = lundiDeLaSemaine(planningWeekOffset);
  const weekDates = JOURS.map((_, i) => {
    const d = new Date(baseMonday);
    d.setDate(baseMonday.getDate() + i);
    return d;
  });
  const weekDateStrs = weekDates.map(toLocalDateStr);
  const aujourdhui = toLocalDateStr(new Date());

  const weekNumber = getWeekNumber(baseMonday);
  const year = baseMonday.getFullYear();

  // Regroupement par jour, périodes multi-jours incluses.
  const activitesParJour = weekDateStrs.map(dateStr =>
    STATE.activites
      .filter(a => {
        if(a.statut === 'Annulée') return false;
        if(!a.date) return false;
        const fin = a.dateFin || a.date;
        return a.date <= dateStr && fin >= dateStr;
      })
      .sort((a,b)=> (a.heureDebut || '99:99').localeCompare(b.heureDebut || '99:99'))
  );

  // Options de lieu groupées par catégorie.
  const groupes = [
    { label: 'Salles Réunion',            cat: 'reunion'   },
    { label: 'Salles Métropole',          cat: 'metropole' },
    { label: 'Établissements scolaires',  cat: 'scolaire'  }
  ];
  let lieuOptions = `<option value="">— Sélectionner un lieu —</option>`;
  groupes.forEach(g => {
    const items = STATE.salles.filter(s => s.categorie === g.cat);
    if(!items.length) return;
    lieuOptions += `<optgroup label="${esc(g.label)}">`;
    items.forEach(s => { lieuOptions += `<option value="${esc(s.nom)}">${esc(s.nom)}</option>`; });
    lieuOptions += `</optgroup>`;
  });
  lieuOptions += `<option value="__autre__">Autre (saisie libre)</option>`;

  mount(container, `
    <div class="planning-annual-wrapper">
      <div class="row-head">
        <h2>Planning</h2>
        <span class="count-tag">${weekDateStrs.filter((_,i)=> activitesParJour[i].length).length} jour(s) occupé(s) cette semaine</span>
      </div>

      <div class="week-nav">
        <button type="button" class="btn secondary small" data-action="planning-prev">◀ Semaine précédente</button>
        <span class="week-label">Semaine ${weekNumber} · ${formatDate(weekDateStrs[0])} — ${formatDate(weekDateStrs[6])}</span>
        <button type="button" class="btn secondary small" data-action="planning-next">Semaine suivante ▶</button>
        <button type="button" class="btn small" data-action="planning-today">Aujourd'hui</button>
        <span class="year-tag">${year}</span>
      </div>

      <div class="planning-annual-grid">
        <div class="cell cell-header">Sem.</div>
        ${JOURS.map((d, i) => `<div class="cell cell-header${(i>=5)?' weekend':''}">${d}</div>`).join('')}
        <div class="cell week-number">${weekNumber}</div>
        ${JOURS.map((d, idx) => {
          const dateStr = weekDateStrs[idx];
          const dayMonth = weekDates[idx].toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
          const isToday = dateStr === aujourdhui;
          let inner = `<div class="day-date">${dayMonth}</div>`;
          activitesParJour[idx].forEach(a => {
            const multi = a.dateFin && a.dateFin !== a.date;
            const heures = (a.heureDebut || a.heureFin)
              ? `${esc(a.heureDebut || '')}${a.heureDebut && a.heureFin ? '–' : ''}${esc(a.heureFin || '')}`
              : (a.duree ? esc(a.duree) : '');
            inner += `<div class="slot${multi ? ' multi-day' : ''}" title="${esc(a.nom)}${a.lieu ? ' · ' + esc(a.lieu) : ''}"
                        data-action="planning-open-activite" data-id="${esc(a.id)}">
              ${esc(a.nom)}${multi ? ' 📅' : ''}
              ${heures ? `<span class="heure">${heures}</span>` : ''}
              <span class="remove" title="Retirer" data-action="planning-remove-activite" data-id="${esc(a.id)}">✕</span>
            </div>`;
          });
          inner += `<button type="button" class="add-btn" title="Ajouter ce jour"
                      data-action="planning-pick-day" data-day="${d}">+</button>`;
          return `<div class="cell${(idx>=5)?' weekend':''}${isToday?' is-today':''}">${inner}</div>`;
        }).join('')}
      </div>

      <div class="form-card">
        <h3>Ajouter une activité ou une période</h3>
        <div class="form-grid">
          <label class="full">Nom <span class="req">*</span>
            <input type="text" id="p-nom" placeholder="Ex : Résidence de création">
          </label>
          <label>Jour de début
            <select id="p-day">${JOURS.map((d,i)=>`<option value="${d}">${d} ${formatDate(weekDateStrs[i]).slice(0,5)}</option>`).join('')}</select>
          </label>
          <label>Date de fin (si période)
            <input type="date" id="p-date-fin">
          </label>
          <label>Type
            <select id="p-type">${ACT_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
          </label>
          <label>Lieu
            <select id="p-lieu-salle" data-action="planning-lieu-change" data-on="change">${lieuOptions}</select>
          </label>
          <label id="p-lieu-custom-wrap" hidden>Lieu personnalisé
            <input type="text" id="p-lieu-custom" placeholder="Nom du lieu">
          </label>
          <label>Heure de début
            <input type="time" id="p-heure-debut">
          </label>
          <label>Heure de fin
            <input type="time" id="p-heure-fin">
          </label>
          <label>Durée
            <input type="text" id="p-duree" placeholder="Ex : 2:00">
          </label>
          <label>Responsable
            <select id="p-responsable">${membreOptions('')}</select>
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn" data-action="planning-add">+ Ajouter au planning</button>
          <span class="hint">Crée une activité « Prévue » visible dans l'onglet Activités.</span>
        </div>
      </div>
    </div>
  `);
}

function refreshPlanning(){
  const c = byId('planning-embed');
  if(c) renderPlanningAnnual(c);
}

/* ---------- Actions ---------- */
registerAction('planning-prev',  () => { planningWeekOffset--; refreshPlanning(); });
registerAction('planning-next',  () => { planningWeekOffset++; refreshPlanning(); });
registerAction('planning-today', () => { planningWeekOffset = 0; refreshPlanning(); });

registerAction('planning-lieu-change', el => {
  const wrap = byId('p-lieu-custom-wrap');
  if(wrap) wrap.hidden = (el.value !== '__autre__');
  if(el.value === '__autre__'){
    const input = byId('p-lieu-custom');
    if(input) input.focus();
  }
});

registerAction('planning-pick-day', el => {
  const sel = byId('p-day');
  if(sel) sel.value = el.dataset.day;
  const nom = byId('p-nom');
  if(nom){ nom.focus(); nom.scrollIntoView({ behavior:'smooth', block:'center' }); }
});

registerAction('planning-remove-activite', el => {
  const a = STATE.activites.find(x => x.id === el.dataset.id);
  if(!a) return;
  if(!confirmAction(`Retirer « ${a.nom} » du planning ?\nL'activité sera supprimée.`)) return;
  STATE.activites = STATE.activites.filter(x => x.id !== el.dataset.id);
  scheduleSave();
  showToast("Activité retirée");
  refreshPlanning();
  if(panelIsActive('activites')) renderActivites();
});

registerAction('planning-open-activite', el => {
  const a = STATE.activites.find(x => x.id === el.dataset.id);
  if(!a) return;
  activiteUI.formOuvert = a.id;
  switchTab('activites');
});

registerAction('planning-add', () => {
  const nom = byId('p-nom').value.trim();
  if(!nom){ showToast("Donnez un nom à l'activité"); byId('p-nom').focus(); return; }

  const day = byId('p-day').value;
  const dayIndex = JOURS.indexOf(day);
  if(dayIndex === -1) return;

  const baseMonday = lundiDeLaSemaine(planningWeekOffset);
  const dateObj = new Date(baseMonday);
  dateObj.setDate(baseMonday.getDate() + dayIndex);
  const dateStr = toLocalDateStr(dateObj);

  const dateFin = byId('p-date-fin').value;
  if(dateFin && dateFin < dateStr){
    showToast("La date de fin précède la date de début");
    return;
  }

  const heureDebut = byId('p-heure-debut').value;
  const heureFin   = byId('p-heure-fin').value;
  if(heureDebut && heureFin && heureFin < heureDebut && !dateFin){
    showToast("L'heure de fin précède l'heure de début");
    return;
  }

  const lieuSalle = byId('p-lieu-salle').value;
  const lieuCustomVal = byId('p-lieu-custom').value.trim();
  let lieu, lieuType = 'autre';
  if(lieuSalle === '__autre__'){
    lieu = lieuCustomVal || 'Lieu à définir';
  } else if(lieuSalle){
    lieu = lieuSalle;
    const found = STATE.salles.find(s => s.nom === lieuSalle);
    if(found) lieuType = found.categorie || 'autre';
  } else {
    lieu = 'Lieu à définir';
  }

  // Durée calculée automatiquement si les deux heures sont renseignées.
  let duree = byId('p-duree').value.trim();
  if(!duree && heureDebut && heureFin){
    const [h1,m1] = heureDebut.split(':').map(Number);
    const [h2,m2] = heureFin.split(':').map(Number);
    const diff = (h2*60+m2) - (h1*60+m1);
    if(diff > 0) duree = `${Math.floor(diff/60)}:${String(diff%60).padStart(2,'0')}`;
  }

  STATE.activites.push({
    id: cryptoId(),
    nom, date: dateStr, dateFin: dateFin || '',
    type: byId('p-type').value,
    lieu, lieuType,
    lieuCustom: (lieuSalle === '__autre__') ? lieuCustomVal : '',
    statut: 'Prévue',
    participants: '', public: '',
    duree, heureDebut, heureFin,
    partenaires: '', responsable: byId('p-responsable').value,
    fonctionne: '', difficultes: '', notes: '',
    annee: dateStr.slice(0,4)
  });

  scheduleSave();
  const periode = dateFin ? ` du ${formatDate(dateStr)} au ${formatDate(dateFin)}` : ` le ${formatDate(dateStr)}`;
  showToast(`« ${nom} » ajouté${periode}`);

  refreshPlanning();
  if(panelIsActive('activites')) renderActivites();
});

function renderProjets(){
